name: Keep alive

# Every 3 days: wake the Render service and touch the database. Supabase's free plan pauses a
# project after 7 days without activity, and a paused database means no eligible pool.
# The last step re-enables this workflow, which resets GitHub's 60-day inactivity timer, so
# the schedule never switches itself off. Run it by hand from the Actions tab at any time.
# The health endpoint needs no sign-in and returns no candidate data (docs/deployment.md).

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ vars.APP_URL || 'https://psm-placements.onrender.com' }}
    steps:
      - name: Wake the app and ping the database
        run: |
          # A sleeping free instance takes about a minute to start; allow up to 10 minutes.
          for i in $(seq 1 40); do
            if body=$(curl -fsS --max-time 60 "$APP_URL/api/health?db=1"); then
              echo "$body"
              if echo "$body" | grep -q '"db":"ok"'; then exit 0; fi
            fi
            echo "Attempt $i: not ready yet"
            sleep 15
          done
          echo "::error::The app or its database didn't answer at $APP_URL"
          exit 1

      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
