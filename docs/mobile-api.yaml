openapi: 3.1.0
info:
  title: PSM Shortlisting — mobile API
  version: 1.12.0
  description: |
    The contract between the Android app (private repo `psm-android`) and this server.

    1.12.0 (server side; migration 022, which the server detects: before it, /pool/companies*
    answers 503 not_ready and the rest keeps working):
    - Share status: `Share.status` (selected, in_process, awaiting, on_hold, shared, applied, closed,
      no_show, rejected), `Share.kind` (shared | applied: an applications tab), `Share.companyStatus`.
      The latest decisive round decides ("Done" / "Completed" after a rejection never reopens it);
      the requirement's master state then applies (closed → closed, on hold → on_hold).
      `outcome` keeps its 1.10 values for older apps. `PoolItem.status`, `PoolItem.shares.applied`;
      `shares.count` / `active` count shared profiles only.
    - Companies: `GET /pool/companies` (hiring drives with requirements, candidates and checks),
      `GET /pool/companies/export` (.xlsx), `POST /pool/companies/import` (tentative start dates from
      the exported file), `PUT /pool/companies/requirements/{key}/tentative-start`,
      `GET /pool/companies/starts` (Calendar).

    1.11.0 (server side; migration 021, which the server detects: before it, "done", the ISE
    auto-assignment and device health stay off and the rest keeps working):
    - "Shortlisting done": `POST /tasks/{taskId}/done`, TaskState `done`, TaskSummary `doneAt`,
      `doneBy`, `autoAssigned`, `assignedVia`; Mine / Team ordered overdue, due today, upcoming,
      no deadline, then done / delivered (kept 7 days after they were finished).
    - Automatic assignment by ISE: a blank Mentor cell whose ISE maps to an active mentor is filled
      with that mentor's name 5 minutes after the row appeared (at most 10 a minute;
      `MOBILE_ISE_AUTO_ASSIGN=off` turns it off; `MOBILE_ISE_OWNERS` sets the mapping).
    - More task reminders (nudge:30 / nudge:90, soon1h / soon15, overdue every 2 h), `task_done`
      and `task_digest` pushes (PushMessage). Done and delivered tasks get none.
    - Notification health: DeviceInfo's optional health fields, RosterEntry `devices`.
    - Analytics: `activity.shortlistings` also counts tasks marked done in the range (once each);
      a done row is never overdue.
    This file is the source of truth. Change it first, then the routes under
    `src/app/api/mobile/v1/`, then the app (which copies this file with `scripts/sync-api.ps1`).

    Status: **draft for Version 0**. Nothing below is implemented yet. Each operation carries its
    delivery phase (`x-phase`: P1 / P2 / P3).

    Principles:
    - **The Google Sheet stays the source of truth.** Starting a screening writes the same
      control-row cells as typing "start" in the sheet, then enters the existing job path
      (`readControlRequest` → `createOrResumeJob` → worker). The agents don't change.
    - **Auth is per user.** The app holds no shared secret: a Google ID token is exchanged for
      short-lived access and refresh tokens. `/api/automation/*` keeps its own `AUTOMATION_TOKEN`
      for the Apps Script; the app never calls those routes.
    - **Errors** are `{ "error": "<what happened and how to fix it>", "code": "<machine code>" }`.
    - **Times** are ISO-8601 with offset (`2026-11-05T15:00:00+05:30`). Deadlines come from the
      sheet in IST.
    - **Enums may grow.** Clients map unknown values to UNKNOWN and keep working.

    Sheet → server hooks (Apps Script, `AUTOMATION_TOKEN`, not part of this contract):
    - `POST /api/automation/assignments`: a PSM Assignee cell changed;
    - `POST /api/automation/tick`: every 5 minutes, drives reminders and escalations.
servers:
  - url: https://psm-placements.onrender.com/api/mobile/v1
    description: Production (Render)
  - url: http://10.0.2.2:3000/api/mobile/v1
    description: Local dev server, as seen from the Android emulator

security:
  - bearer: []

tags:
  - name: auth
  - name: tasks
  - name: screening
  - name: jobs
  - name: review
  - name: analytics
  - name: voice
  - name: teams
  - name: admin
  - name: preps

paths:
  /auth/google:
    post:
      tags: [auth]
      x-phase: P1
      summary: Exchange a Google ID token (Credential Manager) for app tokens
      description: |
        The server verifies the ID token (audience = the server's OAuth web client id), checks that
        the email's domain is allowed and that the email is on the roster (`app.users`, active),
        then issues tokens. The device's FCM token, if sent, is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, device]
              properties:
                idToken: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Valid Google account but not allowed. Access comes from the roster: the account must be a roster email or a linked sign-in account (RosterEntry.signInEmails) of an active person. code = not_on_roster (NxtWave address not on the roster, or access removed) | domain_not_allowed (other account not linked to anyone)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/refresh:
    post:
      tags: [auth]
      x-phase: P1
      summary: Rotate tokens
      description: The refresh token is single-use. Reusing an old one revokes the whole session (theft detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: New tokens, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      x-phase: P1
      summary: End this device's session and unregister its push token
      responses:
        "204": { description: Signed out }

  /me:
    get:
      tags: [auth]
      x-phase: P1
      summary: The signed-in user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/device:
    put:
      tags: [auth]
      x-phase: P1
      summary: Register or refresh this device's FCM token (on token refresh and app start)
      description: |
        1.11.0: the app also sends its notification health (DeviceInfo's optional fields) at
        sign-in, on resume (at most every 6 hours) and after any Fix in Me → Notifications. The
        server stores them on the device with the time (`healthAt`); a request without any of them
        keeps what was stored. Admins see them in GET /admin/roster (`devices`). No push is sent
        about health.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "204": { description: Saved }

  /me/test-notification:
    post:
      tags: [auth]
      x-phase: P1
      summary: Send a real test push (FCM) to this user's devices (Me → Send test notification)
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: integer, description: Devices that accepted the push }

  /tasks:
    get:
      tags: [tasks]
      x-phase: P1
      summary: Rows assigned to me, my team's (leads and admins), or the rows nobody has taken yet
      description: |
        - `mine`: rows whose Mentor cell names me. `team`: every row with a roster mentor (leads and
          admins only; 403 otherwise).
        - `unassigned` (1.9.0, anyone signed in): rows whose Mentor cell is **blank** (a name not on
          the roster still counts as assigned), with a company, assigned in the last 7 days (Assigned
          Date & Time) or with no assigned date, and a deadline not more than 24 h ago (or none).
          Sorted by deadline, soonest first, no deadline last. They have `assignee: null` and state
          `overdue` once the deadline has passed, `new` otherwise.
          1.11.0: since blank cells whose ISE maps to a mentor are now filled automatically (after
          5 minutes), this mostly lists ISEs that have no mapping. A row a lead or admin marked
          done (POST /tasks/{taskId}/done) is left out.
        - 1.11.0, `mine` and `team`: ordered overdue, due today (IST), upcoming (each soonest
          deadline first), no deadline (newest assignment first), then done / delivered (state
          `done`, `shortlist_ready`, `shared`; most recently finished first). Done and delivered
          tasks stay in the list for 7 days after `doneAt` or the delivery, then drop off; open
          tasks keep the 45-day window (a row drops when both its assigned date and its deadline
          are more than 45 days old).
        The ETag is per scope, as before.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, team, unassigned], default: mine }
        - name: state
          in: query
          schema: { type: string, enum: [open, all], default: open }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [tasks, syncedAt]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/TaskSummary" } }
                  syncedAt: { type: string, format: date-time, description: When the control sheet was last read }
        "304": { description: Not changed since the ETag }
        "403": { description: "scope=team without the lead role" }

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      x-phase: P1
      summary: One task with everything the task screen shows
      description: "Since 1.9.0 a task nobody has taken (blank Mentor cell) is visible to everyone signed in; it used to be 404 for members."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/take:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      x-phase: P9
      summary: "Anyone signed in. Takes a task nobody has taken: writes the caller's roster name into the row's Mentor cell."
      description: |
        1. The control tab is read again and the row found by its task id (a moved row is never
           overwritten). A Mentor cell that's no longer blank → 409 `already_assigned`
           ("<Name> already took this task."). A cell that already names the caller answers 200
           (a double tap or a retried request).
        2. The caller's "assignment" push is claimed first (dedupe key `assign:<taskId>:<email>`):
           no "New task" push for a task they took themselves. It's released if the write fails.
        3. The caller's roster name is written into the Mentor cell (one cell, RAW).
        4. The task is acknowledged for the caller (the row `/tasks/{taskId}/ack` writes): no sticky
           "new task" alarm. The cached control snapshot is dropped. Audit log: `task_taken`.
      responses:
        "200": { description: "The task, now the caller's", content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "already_assigned", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /tasks/{taskId}/assign:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      x-phase: P9
      summary: "Admins and leads. Writes a member's roster name into the Mentor cell (it overwrites, so this also reassigns)."
      description: |
        The row is read again and found by its task id first, as for take. The member then gets the
        usual "assignment" push from the next sync, which starts at once in the background.
        Audit log: `task_assigned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, description: "An active roster email" }
      responses:
        "200": { description: "The task, now the member's", content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "403": { description: "admin_only (members)" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "invalid_member: the email isn't an active roster member" }

  /tasks/{taskId}/ack:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      x-phase: P1
      summary: '"Start now" — acknowledge the assignment (clears the sticky notification, stops reminders)'
      responses:
        "200":
          description: Acknowledged (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [ackAt]
                properties:
                  ackAt: { type: string, format: date-time }

  /tasks/{taskId}/done:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      x-phase: P9
      summary: '1.11.0. "Shortlisting done" (or undo). The task''s assignee, leads and admins.'
      description: |
        - `done: true` sets `done_at = now()` and `done_by = <caller>` for the person the row is
          assigned to now. Idempotent: a second call keeps the first time (and sends nothing).
        - `done: false` clears both (undo).
        - A task is `done` while the mark stands and the assignee hasn't changed: a reassignment
          (sheet, Take, Assign) clears it, as it clears the acknowledgement. A lead or admin may
          also mark a row nobody has; it then leaves `scope=unassigned`.
        - A done task stops showing as overdue (lists, analytics, digests) and gets no reminder,
          nudge, overdue or escalation push.
        - Audit log: `task_done` / `task_reopened` (on a change only).
        - A new done mark pushes `task_done` to every active admin except the caller.
        - 503 `not_available` until the server's migration 021 is applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200": { description: "The task as it is now (state done, doneAt, doneBy; or reopened)", content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "400": { description: "invalid_body: done must be true or false", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "not_your_task: the caller is neither the task's assignee nor a lead / admin", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "not_available: the server's database isn't updated for this yet (migration 021)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /tasks/{taskId}/access:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [screening]
      x-phase: P1
      summary: Can the service account read and write the row's Internal Sheet?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canRead, canWrite, serviceAccountEmail, sheetUrl]
                properties:
                  canRead: { type: boolean }
                  canWrite: { type: boolean, description: Needed to deliver the shortlist tab }
                  serviceAccountEmail: { type: string, description: Shown with a copy button when access is missing }
                  sheetUrl: { type: string, format: uri }

  /tasks/{taskId}/tabs:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [screening]
      x-phase: P1
      summary: The Internal Sheet's tabs with row counts (for Subsheets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tabs]
                properties:
                  tabs:
                    type: array
                    items:
                      type: object
                      required: [name, rows, url]
                      properties:
                        name: { type: string }
                        rows: { type: integer, description: Data rows (header excluded) }
                        withResume: { type: integer, description: Rows with a resume link }
                        url: { type: string, format: uri, description: Link to the tab (gid) }
                        suggested: { type: boolean, description: Named in the row's remarks, e.g. "edge applied" }
        "403": { description: "No access — see /access", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /tasks/{taskId}/jd-autofill:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [screening]
      x-phase: P2
      summary: Draft focus + must-haves from the row's JD link (or pasted text), via the existing domain autofill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, description: Optional pasted JD text. When absent, the row's JD link is read. }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                type: object
                required: [focus, mustHaves, warnings]
                properties:
                  focus: { type: string }
                  mustHaves: { type: array, items: { type: string }, description: '"X or Y" kept as one item' }
                  warnings: { type: array, items: { type: string } }
        "422": { description: JD unreadable or empty }

  /intake/parse:
    post:
      tags: [voice]
      x-phase: P2
      summary: Typed or spoken raw text → screening fields
      description: |
        LLM (existing Gemini → OpenAI → Mistral chain) with structured output, validated by the
        deterministic `parseInstructions`. The text is untrusted: it only fills fields and is never
        executed. Fields the model isn't sure about are listed in `unclear`, and the app highlights them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, text, source]
              properties:
                taskId: { type: string }
                text: { type: string, maxLength: 8000 }
                source: { type: string, enum: [voice, typed] }
      responses:
        "200":
          description: Parsed
          content:
            application/json:
              schema:
                type: object
                required: [config, unclear]
                properties:
                  config: { $ref: "#/components/schemas/ScreeningConfig" }
                  unclear: { type: array, items: { type: string, description: A ScreeningConfig field name } }
                  notes: { type: string }

  /tasks/{taskId}/estimate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [screening]
      x-phase: P1
      summary: ETA for the recheck screen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningConfig" }
      responses:
        "200": { description: Estimate, content: { application/json: { schema: { $ref: "#/components/schemas/Estimate" } } } }

  /tasks/{taskId}/start:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: Idempotency-Key
        in: header
        required: true
        description: A UUID per tap of Start. Retries with the same key return the same job.
        schema: { type: string, minLength: 8, maxLength: 80 }
    post:
      tags: [screening]
      x-phase: P1
      summary: Start screening — writes the control row (Subsheets, Instructions, Github, DSA, Experience, Trigger=start), then queues the job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningConfig" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "200": { description: Same Idempotency-Key — the existing job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { description: A job is already running for this row (body has the job), content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "422": { description: "Invalid config (no subsheets, no access, topN out of range)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /jobs:
    get:
      tags: [jobs]
      x-phase: P1
      summary: My recent jobs (leads can pass scope=team)
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, team], default: mine }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }

  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      x-phase: P1
      summary: Live job state (the app polls every 5 s while the job screen is open; pushes cover the rest)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobId}/stop:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      x-phase: P1
      summary: Stop — a queued job is cancelled; a running one delivers what it has screened (same as the sheet's stop)
      responses:
        "200": { description: Stop requested, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { description: Not running }

  /jobs/{jobId}/shortlist:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [review]
      x-phase: P2
      summary: The AI shortlist, best first, with evidence for manual review
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [candidates, deliveredTabUrl]
                properties:
                  candidates: { type: array, items: { $ref: "#/components/schemas/ShortlistCandidate" } }
                  deliveredTabUrl: { type: string, format: uri }

  /jobs/{jobId}/shares:
    parameters:
      - $ref: "#/components/parameters/JobId"
    put:
      tags: [review]
      x-phase: P2
      summary: Save manual decisions (idempotent per candidate key; last write wins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [candidateKey, decision]
                    properties:
                      candidateKey: { type: string, description: Mobile number key, as in the delivered tab }
                      decision: { type: string, enum: [share, hold, reject] }
                      reason: { type: string, enum: [skills_gap, experience, location, availability, duplicate, quality, other] }
                      note: { type: string, maxLength: 300 }
      responses:
        "204": { description: Saved }

  /jobs/{jobId}/send-to-company:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string }
    post:
      tags: [review]
      x-phase: P2
      summary: Write the shared candidates to psm_shared_<company>_<date> in the Internal Sheet
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                required: [tabName, tabUrl, count]
                properties:
                  tabName: { type: string }
                  tabUrl: { type: string, format: uri }
                  count: { type: integer }

  /analytics:
    get:
      tags: [analytics]
      x-phase: P1
      summary: Tasks → screenings → shortlists delivered, on time, per person and per row, with sheet links
      description: "Since 1.9.0 the response also has `activity`: what each member did in the range (shortlistings, preps given, prep calls, RSAs, guidance meets, mock interviews). See Analytics.activity."
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 7, maximum: 365 } }
        - { name: from, in: query, schema: { type: string, format: date, description: "IST day; overrides days" } }
        - { name: to, in: query, schema: { type: string, format: date, description: "IST day, inclusive" } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, team], default: mine, description: "team: leads and admins (403 admin_only otherwise)" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }

  /stt/token:
    post:
      tags: [voice]
      x-phase: P2
      summary: A short-lived token for one live speech-to-text WebSocket (provider keys never leave the server)
      description: |
        Providers are tried in order — **ElevenLabs (Scribe v2 Realtime) first, Deepgram as the
        fallback** (VOICE_STT_PROVIDERS on the server). Each provider has a pool of API keys used
        round-robin; a key that answers 401/403 is parked, one that answers 429 cools down, and the
        next key (then the next provider) is tried. The app connects to `url` with `token`; if that
        WebSocket fails, it asks again with that provider in `exclude` to get the fallback.
        Tokens: ElevenLabs single-use (expires in 15 min, valid for one connection); Deepgram
        temporary JWT (30 s to open the connection).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude:
                  type: array
                  items: { type: string, enum: [elevenlabs, deepgram] }
                  description: Providers that just failed on this device, for this attempt
                language: { type: string, default: en, description: "BCP-47, e.g. en, en-IN, hi" }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [provider, token, expiresIn, url]
                properties:
                  provider: { type: string, enum: [elevenlabs, deepgram] }
                  token: { type: string }
                  expiresIn: { type: integer, description: seconds }
                  url: { type: string, description: "wss URL with model, language and audio format already set" }
                  audio:
                    type: object
                    description: What to stream
                    properties:
                      encoding: { type: string, example: pcm_s16le }
                      sampleRate: { type: integer, example: 16000 }
        "503": { description: "Every provider and key is out of capacity right now (code = stt_unavailable); the app falls back to typing", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

