    AppRelease:
      type: object
      required: [versionCode, sha256, downloadPath]
      properties:
        versionCode: { type: integer }
        versionName: { type: string }
        notes: { type: string, description: "What's new (markdown-ish plain text)" }
        sizeBytes: { type: integer }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        minSupported: { type: integer, description: "Phones below this version code must update first (0 = never forced)" }
        publishedAt: { type: string, format: date-time }
        downloadPath: { type: string, description: "Relative to /api/mobile/v1, e.g. /app/releases/15/apk" }
    PushMessage:
      description: |
        FCM **data** message (not a notification message), so the app always builds the notification
        itself: sticky assignment with countdown, re-post on swipe. High priority for assignment,
        reminder and overdue; normal for job updates.

        1.11.0 (tasks). Every push also lands in the inbox. Done tasks (POST /tasks/{taskId}/done)
        and delivered ones (shortlist_ready) get no reminder, overdue, escalation or nudge push.
        - `reminder` and `overdue` now carry `slot`, `title` and `body` (the 1.10 app ignores them
          and builds its own text; the inbox uses them). Per task, at most:
          - `reminder` slot `nudge:30` / `nudge:90`: not started (no Start now, no screening) 30
            and 90 min after the assignment push (never past the deadline, never more than 6 h
            after it). "Not started · Acme" / "Assigned to you 30 min ago · due 6:00 PM. Tap Start now."
            Dedupe `nudge:30|nudge:90:<taskId>:<email>`.
          - `reminder` slot `soon1h` / `soon15`: 1 h and 15 min before the deadline, started or
            not, each only when the person was told before that moment. "Due in 1 hour · Acme".
            Dedupe `soon1h|soon15:<taskId>:<email>` (1.10's `soon:` key counts as soon15).
          - `overdue` slot `overdue:0` … `overdue:3`: at the deadline, then every 2 h until done,
            at most 4, up to a day after the deadline. "Overdue · Acme" / "2 h past the deadline
            (6:00 PM). Mark done when the shortlist is shared." Dedupe
            `overdue:<0-3>:<taskId>:<email>` (1.10's `overdue:` key counts as slot 0).
          A server that slept through a slot sends the latest one only. The 1.10 "half the time
          gone" reminder is no longer sent. `escalation` is unchanged.
        - `assignment` for a row the server filled from the ISE mapping also carries
          `assignedVia: "ise"`, `ise`, `title` ("New task · Acme") and `body` ("Assigned to you as
          Sneha Padi's mentor (ISE)"). Such rows get no task_unassigned "new" push.
        - `task_done` → every active admin except the person who marked it, when a task is marked
          done. Task channel, not sticky; tapping opens the task. Data: taskId, company, by (roster
          name), title ("Rakesh finished Acme's shortlisting"), body. Dedupe
          `done:<taskId>:<doneAt ms>:<email>` (a mark undone and set again notifies again).
        - `task_digest` → each active member who has open tasks (not done or delivered), at 09:15
          IST (sent until noon if the server slept) and 18:00 IST (until 22:00). Daily summary
          channel; tapping opens Tasks. Data: day (YYYY-MM-DD), slot (am|pm), title, body, count
          (open tasks). am: "Your tasks today: 3 open · 1 overdue · 2 due today" / "Acme, Globex,
          Initech +1 more". pm: "Still open: Acme, Globex" / "Mark done when the shortlist is
          shared." Dedupe `task:digest:<am|pm>:<day>:<email>`.

        1.10.0 (Academy candidates; channel "Academy candidates", default importance; academy_digest
        on the digest channel). Every one carries `title` and `body` (names and companies, never
        phone numbers) and has inbox text. Tapping opens the candidate (`uid`), else the Pool tab.
        At most ~30 per mentor per run: the rest come as one push of the same kind with
        `summary: "true"`, no uid ("12 updates for your candidates"). Each job's first run (and the
        first after the deploy) is a baseline: nothing is sent.
        - `pool_assigned` → the mentor, when a candidate's MENTOR cell is set to them (from blank or
          someone else). Data: uid, name, track (frontend|backend|fullstack|aiml|""). Dedupe
          `pool:assigned:<uid>:<email>`.
        - `pool_shared` → the candidate's mentor (unassigned: nobody; it's in the digest), when the
          candidate first appears in a company sheet. Data: uid, name, company, role. Dedupe
          `pool:shared:<shareId>:<email>`.
        - `pool_status` → the candidate's mentor, when a round or the final status changed; one push
          per candidate per company per run (body like "TR Round 1: Cleared · Final status:
          Selected"). Data: uid, name, company, role, stage, outcome. Dedupe
          `pool:status:<shareId>:<hash of rounds+final>:<email>`.
        - `pool_interview` → the candidate's mentor, when a drill-down interview row appears for an
          assessed candidate (dated today or later) or its date / time changes. Data: uid, name,
          company, round, day (YYYY-MM-DD), time ("4:00 PM – 5:00 PM" or as typed), prepId. Dedupe
          `pool:iv:<prepId>:<day>:<time>:<email>`.
        - `pool_meeting` → each candidate's mentor who didn't schedule it, when a mock interview or
          guidance meet with their candidate is scheduled. Data: uid, name ("Asha + 2 more" for
          several), kind (mock|guidance), startsAt, by (the scheduler's name), meetingId. Dedupe
          `pool:meet:<meetingId>:<email>`.
        - `academy_digest` → every active member at 08:30 IST (sent until noon if the server slept),
          only when a number is above zero: "Academy interviews today 5 (2 yours) · tomorrow 3 ·
          shared yesterday 12 · selected this week 1" (zero parts left out). Data: day, title, body.
          Dedupe `academy:digest:<day>:<email>`.

        1.9.0:
        - `task_unassigned`: a task nobody has taken (blank Mentor cell). Channel "New tasks" (high
          importance, not sticky); tapping opens the task. Data: taskId, company, profilesRequired,
          deadline (omitted when none), ise, iseOwner (name or ""), product, stage, title, body.
          - stage `new` → every active roster member (admins, leads, mentors), once, for a row
            assigned in the last 6 h whose deadline hasn't passed (the first sync after a deploy
            replays nothing older). "New task · Acme (ISE <name>)" / "10 profiles by 6:00 PM · no
            mentor yet. Tap to take it."
          - stage `reminder` → the ISE's own mentor and the admins, at half the time between
            assigned and deadline and 30 min before the deadline (each once). "Still no mentor ·
            Acme" / "<ISE>'s task · due 6:00 PM. Take it or assign someone."
          - stage `due` → the same people, once, at the deadline (up to a day after it). "Deadline
            passed · Acme" / "Nobody took <ISE>'s task."
          Dedupe keys `unassigned:<new|half|soon|due>:<taskId>:<email>`. Nothing is sent once the
          row has a mentor. The app cancels a task's task_unassigned notification on an
          `assignment` push for the same taskId, after a successful take or assign, and when
          GET /tasks?scope=unassigned no longer lists it.
        - `feedback`: to every active admin when someone reports feedback (POST /feedback). Channel
          "Feedback from the team" (high importance, heads-up), admins only; tapping opens
          Me → Feedback. Data: feedbackId, from, category, title, body.
        - `prep_reminder` now comes 3 h, 1 h and 15 min before a prep is due (each only if the prep
          was assigned before that moment; dedupe `prep:soon3h|soon1h|soon:<prepId>:<email>`), and
          `prep_overdue` at the deadline, then every 2 h until the interview starts, at most 4
          (dedupe `prep:overdue:<0-3>:<prepId>:<email>`), while "Prep Given" isn't Yes.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [assignment, reminder, overdue, escalation, job_update, test, prep_assigned, prep_reminder, prep_overdue, prep_escalation, prep_unassigned, interview_checkin, prep_digest, prep_doc_ready, recording_ready, rsa_ready, meeting_reminder, team_account, admin_notice, app_update, task_unassigned, feedback, pool_assigned, pool_shared, pool_status, pool_interview, pool_meeting, academy_digest, task_done, task_digest]
        taskId: { type: string, description: "Task pushes (incl. task_unassigned)" }
        prepId: { type: string, description: "Prep pushes (prep_*, interview_checkin) prep_doc_ready, recording_ready (the call was added to the sheet), meeting_reminder (when the meeting is a prep's), pool_interview" }
        meetingId: { type: string, description: "meeting_reminder, recording_ready (Meet), pool_meeting" }
        meetUrl: { type: string, format: uri, description: "meeting_reminder: the Join action" }
        url: { type: string, format: uri, description: "prep_doc_ready, rsa_ready: the document" }
        candidate: { type: string }
        round: { type: string }
        uid: { type: string, description: "1.10.0 pool_* pushes: the Academy pool candidate (opens GET /pool/{uid})" }
        name: { type: string, description: "1.10.0 pool_* pushes: the candidate's name" }
        role: { type: string, description: "pool_shared, pool_status" }
        outcome: { $ref: "#/components/schemas/ShareOutcome" }
        track: { type: string, description: "pool_assigned: frontend | backend | fullstack | aiml | \"\"" }
        day: { type: string, format: date, description: "pool_interview: the interview day; academy_digest, task_digest: today" }
        slot: { type: string, description: "1.11.0. reminder: nudge:30 | nudge:90 | soon1h | soon15; overdue: overdue:0 … overdue:3; task_digest: am | pm" }
        count: { type: string, description: "1.11.0 task_digest: the person's open tasks" }
        assignedVia: { type: string, enum: [ise], description: "1.11.0 assignment: the server filled the Mentor cell from the ISE mapping" }
        time: { type: string, description: "pool_interview: the interview time as shown (\"\" when none)" }
        kind: { type: string, enum: [mock, guidance], description: "pool_meeting" }
        startsAt: { type: string, format: date-time, description: "pool_meeting" }
        by: { type: string, description: "pool_meeting: who scheduled it (roster name). task_done (1.11.0): who marked it done" }
        summary: { type: string, enum: ["true"], description: "pool_*: this push sums up the run's other updates (no uid)" }
        category: { type: string, enum: [academy, edge, external, problem, idea, other], description: "Prep pushes: academy / edge / external. feedback: problem / idea / other." }
        edgeVersion: { type: string }
        interviewDay: { type: string, format: date }
        interviewStart: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        digest: { type: string, enum: [morning, evening] }
        jobId: { type: string }
        company: { type: string }
        profilesRequired: { type: string }
        deadline: { type: string, format: date-time }
        jobStatus: { $ref: "#/components/schemas/JobStatus" }
        earlyShortlist: { type: string, enum: ["true", "false"] }
        title: { type: string }
        body: { type: string }
        noticeId: { type: string, format: uuid, description: "admin_notice" }
        sticky: { type: string, enum: ["true", "false"], description: "admin_notice: stays until Acknowledge" }
        from: { type: string, description: "admin_notice: the sending admin's name. feedback: the sender's name." }
        feedbackId: { type: string, format: uuid, description: "feedback" }
        stage: { type: string, description: "task_unassigned: new | reminder | due. pool_status (1.10.0): the share's stage label (\"TR Round 1 · Cleared\")" }
