      summary: "RsaRun: { id, status: queued|running|done|failed, step, error, mode: create|update, result: { rsaId, url, title, version, sheetStatus: added|exists|failed, warnings: [string] } | null, createdAt }."
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }

