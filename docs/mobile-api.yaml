openapi: 3.1.0
info:
  title: PSM Shortlisting — mobile API
  version: 1.4.0
  description: |
    The contract between the Android app (private repo `psm-android`) and this server.
    This file is the source of truth. Change it first, then the routes under
    `src/app/api/mobile/v1/`, then the app (which copies this file with `scripts/sync-api.ps1`).

    Status: **draft for Version 0**. Nothing below is implemented yet. Each operation carries its
    delivery phase (`x-phase`: P1 / P2 / P3).

    Principles:
    - **The Google Sheet stays the source of truth.** Starting a screening writes the same
      control-row cells as typing "start" in the sheet, then enters the existing job path
      (`readControlRequest` → `createOrResumeJob` → worker). The agents don't change.
    - **Auth is per user.** The app holds no shared secret: a Google ID token is exchanged for
      short-lived access and refresh tokens. `/api/automation/*` keeps its own `AUTOMATION_TOKEN`
      for the Apps Script; the app never calls those routes.
    - **Errors** are `{ "error": "<what happened and how to fix it>", "code": "<machine code>" }`.
    - **Times** are ISO-8601 with offset (`2026-11-05T15:00:00+05:30`). Deadlines come from the
      sheet in IST.
    - **Enums may grow.** Clients map unknown values to UNKNOWN and keep working.

    Sheet → server hooks (Apps Script, `AUTOMATION_TOKEN`, not part of this contract):
    - `POST /api/automation/assignments`: a PSM Assignee cell changed;
    - `POST /api/automation/tick`: every 5 minutes, drives reminders and escalations.
servers:
  - url: https://psm-placements.onrender.com/api/mobile/v1
    description: Production (Render)
  - url: http://10.0.2.2:3000/api/mobile/v1
    description: Local dev server, as seen from the Android emulator

security:
  - bearer: []

tags:
  - name: auth
  - name: tasks
  - name: screening
  - name: jobs
  - name: review
  - name: analytics
  - name: voice
  - name: teams
  - name: admin
  - name: preps

paths:
  /auth/google:
    post:
      tags: [auth]
      x-phase: P1
      summary: Exchange a Google ID token (Credential Manager) for app tokens
      description: |
        The server verifies the ID token (audience = the server's OAuth web client id), checks that
        the email's domain is allowed and that the email is on the roster (`app.users`, active),
        then issues tokens. The device's FCM token, if sent, is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken, device]
              properties:
                idToken: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Valid Google account but not allowed. Access comes from the roster: the account must be a roster email or a linked sign-in account (RosterEntry.signInEmails) of an active person. code = not_on_roster (NxtWave address not on the roster, or access removed) | domain_not_allowed (other account not linked to anyone)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /auth/refresh:
    post:
      tags: [auth]
      x-phase: P1
      summary: Rotate tokens
      description: The refresh token is single-use. Reusing an old one revokes the whole session (theft detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: New tokens, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      x-phase: P1
      summary: End this device's session and unregister its push token
      responses:
        "204": { description: Signed out }

  /me:
    get:
      tags: [auth]
      x-phase: P1
      summary: The signed-in user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/device:
    put:
      tags: [auth]
      x-phase: P1
      summary: Register or refresh this device's FCM token (on token refresh and app start)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "204": { description: Saved }

  /me/test-notification:
    post:
      tags: [auth]
      x-phase: P1
      summary: Send a real test push (FCM) to this user's devices (Me → Send test notification)
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: integer, description: Devices that accepted the push }

  /tasks:
    get:
      tags: [tasks]
      x-phase: P1
      summary: Rows assigned to me (or my team, for leads)
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, team], default: mine }
        - name: state
          in: query
          schema: { type: string, enum: [open, all], default: open }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [tasks, syncedAt]
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/TaskSummary" } }
                  syncedAt: { type: string, format: date-time, description: When the control sheet was last read }
        "304": { description: Not changed since the ETag }
        "403": { description: "scope=team without the lead role" }

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      x-phase: P1
      summary: One task with everything the task screen shows
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/ack:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      x-phase: P1
      summary: '"Start now" — acknowledge the assignment (clears the sticky notification, stops reminders)'
      responses:
        "200":
          description: Acknowledged (idempotent)
          content:
            application/json:
              schema:
                type: object
                required: [ackAt]
                properties:
                  ackAt: { type: string, format: date-time }

  /tasks/{taskId}/access:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [screening]
      x-phase: P1
      summary: Can the service account read and write the row's Internal Sheet?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canRead, canWrite, serviceAccountEmail, sheetUrl]
                properties:
                  canRead: { type: boolean }
                  canWrite: { type: boolean, description: Needed to deliver the shortlist tab }
                  serviceAccountEmail: { type: string, description: Shown with a copy button when access is missing }
                  sheetUrl: { type: string, format: uri }

  /tasks/{taskId}/tabs:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [screening]
      x-phase: P1
      summary: The Internal Sheet's tabs with row counts (for Subsheets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [tabs]
                properties:
                  tabs:
                    type: array
                    items:
                      type: object
                      required: [name, rows, url]
                      properties:
                        name: { type: string }
                        rows: { type: integer, description: Data rows (header excluded) }
                        withResume: { type: integer, description: Rows with a resume link }
                        url: { type: string, format: uri, description: Link to the tab (gid) }
                        suggested: { type: boolean, description: Named in the row's remarks, e.g. "edge applied" }
        "403": { description: "No access — see /access", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /tasks/{taskId}/jd-autofill:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [screening]
      x-phase: P2
      summary: Draft focus + must-haves from the row's JD link (or pasted text), via the existing domain autofill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, description: Optional pasted JD text. When absent, the row's JD link is read. }
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                type: object
                required: [focus, mustHaves, warnings]
                properties:
                  focus: { type: string }
                  mustHaves: { type: array, items: { type: string }, description: '"X or Y" kept as one item' }
                  warnings: { type: array, items: { type: string } }
        "422": { description: JD unreadable or empty }

  /intake/parse:
    post:
      tags: [voice]
      x-phase: P2
      summary: Typed or spoken raw text → screening fields
      description: |
        LLM (existing Gemini → OpenAI → Mistral chain) with structured output, validated by the
        deterministic `parseInstructions`. The text is untrusted: it only fills fields and is never
        executed. Fields the model isn't sure about are listed in `unclear`, and the app highlights them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, text, source]
              properties:
                taskId: { type: string }
                text: { type: string, maxLength: 8000 }
                source: { type: string, enum: [voice, typed] }
      responses:
        "200":
          description: Parsed
          content:
            application/json:
              schema:
                type: object
                required: [config, unclear]
                properties:
                  config: { $ref: "#/components/schemas/ScreeningConfig" }
                  unclear: { type: array, items: { type: string, description: A ScreeningConfig field name } }
                  notes: { type: string }

  /tasks/{taskId}/estimate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [screening]
      x-phase: P1
      summary: ETA for the recheck screen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningConfig" }
      responses:
        "200": { description: Estimate, content: { application/json: { schema: { $ref: "#/components/schemas/Estimate" } } } }

  /tasks/{taskId}/start:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: Idempotency-Key
        in: header
        required: true
        description: A UUID per tap of Start. Retries with the same key return the same job.
        schema: { type: string, minLength: 8, maxLength: 80 }
    post:
      tags: [screening]
      x-phase: P1
      summary: Start screening — writes the control row (Subsheets, Instructions, Github, DSA, Experience, Trigger=start), then queues the job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningConfig" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "200": { description: Same Idempotency-Key — the existing job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { description: A job is already running for this row (body has the job), content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "422": { description: "Invalid config (no subsheets, no access, topN out of range)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /jobs:
    get:
      tags: [jobs]
      x-phase: P1
      summary: My recent jobs (leads can pass scope=team)
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, team], default: mine }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }

  /jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      x-phase: P1
      summary: Live job state (the app polls every 5 s while the job screen is open; pushes cover the rest)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{jobId}/stop:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [jobs]
      x-phase: P1
      summary: Stop — a queued job is cancelled; a running one delivers what it has screened (same as the sheet's stop)
      responses:
        "200": { description: Stop requested, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { description: Not running }

  /jobs/{jobId}/shortlist:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [review]
      x-phase: P2
      summary: The AI shortlist, best first, with evidence for manual review
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [candidates, deliveredTabUrl]
                properties:
                  candidates: { type: array, items: { $ref: "#/components/schemas/ShortlistCandidate" } }
                  deliveredTabUrl: { type: string, format: uri }

  /jobs/{jobId}/shares:
    parameters:
      - $ref: "#/components/parameters/JobId"
    put:
      tags: [review]
      x-phase: P2
      summary: Save manual decisions (idempotent per candidate key; last write wins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [candidateKey, decision]
                    properties:
                      candidateKey: { type: string, description: Mobile number key, as in the delivered tab }
                      decision: { type: string, enum: [share, hold, reject] }
                      reason: { type: string, enum: [skills_gap, experience, location, availability, duplicate, quality, other] }
                      note: { type: string, maxLength: 300 }
      responses:
        "204": { description: Saved }

  /jobs/{jobId}/send-to-company:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string }
    post:
      tags: [review]
      x-phase: P2
      summary: Write the shared candidates to psm_shared_<company>_<date> in the Internal Sheet
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema:
                type: object
                required: [tabName, tabUrl, count]
                properties:
                  tabName: { type: string }
                  tabUrl: { type: string, format: uri }
                  count: { type: integer }

  /analytics:
    get:
      tags: [analytics]
      x-phase: P1
      summary: Tasks → screenings → shortlists delivered, on time, per person and per row, with sheet links
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 7, maximum: 365 } }
        - { name: from, in: query, schema: { type: string, format: date, description: "IST day; overrides days" } }
        - { name: to, in: query, schema: { type: string, format: date, description: "IST day, inclusive" } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, team], default: mine, description: "team: leads and admins (403 admin_only otherwise)" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }

  /stt/token:
    post:
      tags: [voice]
      x-phase: P2
      summary: A short-lived token for one live speech-to-text WebSocket (provider keys never leave the server)
      description: |
        Providers are tried in order — **ElevenLabs (Scribe v2 Realtime) first, Deepgram as the
        fallback** (VOICE_STT_PROVIDERS on the server). Each provider has a pool of API keys used
        round-robin; a key that answers 401/403 is parked, one that answers 429 cools down, and the
        next key (then the next provider) is tried. The app connects to `url` with `token`; if that
        WebSocket fails, it asks again with that provider in `exclude` to get the fallback.
        Tokens: ElevenLabs single-use (expires in 15 min, valid for one connection); Deepgram
        temporary JWT (30 s to open the connection).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exclude:
                  type: array
                  items: { type: string, enum: [elevenlabs, deepgram] }
                  description: Providers that just failed on this device, for this attempt
                language: { type: string, default: en, description: "BCP-47, e.g. en, en-IN, hi" }
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema:
                type: object
                required: [provider, token, expiresIn, url]
                properties:
                  provider: { type: string, enum: [elevenlabs, deepgram] }
                  token: { type: string }
                  expiresIn: { type: integer, description: seconds }
                  url: { type: string, description: "wss URL with model, language and audio format already set" }
                  audio:
                    type: object
                    description: What to stream
                    properties:
                      encoding: { type: string, example: pcm_s16le }
                      sampleRate: { type: integer, example: 16000 }
        "503": { description: "Every provider and key is out of capacity right now (code = stt_unavailable); the app falls back to typing", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /teams/link:
    put:
      tags: [teams]
      x-phase: P3
      summary: Save my own Power Automate (Teams Workflows) webhook URL, stored encrypted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowUrl]
              properties:
                flowUrl: { type: string, format: uri }
                microsoftUpn: { type: string, description: From MSAL sign-in; used to show whose Teams it posts from }
      responses:
        "204": { description: Saved }
        "422": { description: Not a Power Automate / Logic Apps webhook URL }
    delete:
      tags: [teams]
      x-phase: P3
      summary: Remove my Teams link
      responses:
        "204": { description: Removed }

  /teams/share:
    post:
      tags: [teams]
      x-phase: P3
      summary: Post the analytics card through my own flow (it appears from my Teams account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                company: { type: string }
                message: { type: string, maxLength: 500 }
      responses:
        "202": { description: Sent to the flow }
        "409": { description: No Teams link saved yet }

  /admin/roster:
    get:
      tags: [admin]
      x-phase: P1
      summary: The roster (admin). The app's Me → Team screen.
      responses:
        "403": { description: Not an admin (code admin_only) }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
    put:
      tags: [admin]
      x-phase: P1
      summary: Replace the roster (admin). Also refreshes the control sheet's Mentor dropdown when the active names changed.
      description: |
        Send everyone. People left out (or active=false) lose access at once: sessions revoked,
        devices removed, history kept. Refused (422 invalid_roster) when an email isn't a NxtWave
        address, two active people share a name, no active admin would remain, or the caller would
        remove their own admin access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/RosterEntry" } }
      responses:
        "200":
          description: Saved. The roster as stored, and what happened to the sheet's dropdown.
          content:
            application/json:
              schema:
                type: object
                required: [users, mentorDropdown]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/RosterEntry" } }
                  mentorDropdown:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, description: "False: the roster is saved but the dropdown couldn't be updated" }
                      message: { type: string }
        "403": { description: Not an admin (code admin_only) }
        "422": { description: Refused with a sentence (code invalid_roster) }

  /preps:
    get:
      tags: [preps]
      x-phase: P4
      summary: The Calendar's interviews and preps (EDGE "Edge Team drill down", columns A..Z).
      description: |
        Read from (and written to) the SOURCE tab behind EDGE's IMPORTRANGE mirror: writing into the
        mirror would break the import. Writes only use values the sheet's dropdowns allow.
        Every row with an interview between `from` and `to` (IST days, at most 62 days), plus every
        prep still to be given (whatever its date), with the prep numbers. Rows are read from the
        sheet (cached 30 s); category and tags come from the eligible pool (matched by phone), the
        sheet's Product cell is the fallback. ETag-aware: unchanged → 304.
        SLA: an interview on the next day or sooner (as of the row's first appearance in the sheet)
        is due 45 minutes after it appeared (`slaKind` mandatory); a later interview is due 24 h
        before it (before_interview); rows already there when tracking began have none.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "Default today − 7" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Default today + 14" }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "304": { description: Not modified }
        "422": { description: Bad window (code invalid_window) }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [from, to, today, items, stats, syncedAt]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  today: { type: string, format: date, description: "Today in IST" }
                  items: { type: array, items: { $ref: "#/components/schemas/PrepItem" } }
                  stats: { $ref: "#/components/schemas/PrepStats" }
                  syncedAt: { type: string, format: date-time, description: "When the sheet was read" }
                  interviewStatusOptions: { type: array, items: { type: string }, description: "The sheet's Candidate's Status dropdown values (exact spellings), usual ones first" }

  /preps/{prepId}:
    get:
      tags: [preps]
      x-phase: P4
      summary: One prep's page.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PrepDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /preps/{prepId}/status:
    post:
      tags: [preps]
      x-phase: P4
      summary: Set "Prep Given" (done also fills Prep Date / Prep Time, and "Prep given by" when empty).
      description: |
        Allowed for the prep's mentor(s), leads and admins, or anyone when it's unassigned.
        `pending` reopens it (clears Prep Given, Prep Date and Prep Time). A document name goes to
        "Prep Document"; a note is appended to "Remarks".
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/PrepStatus" }
                document: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 300 }
      responses:
        "200": { description: The updated prep, content: { application/json: { schema: { $ref: "#/components/schemas/PrepDetail" } } } }
        "403": { description: Someone else's prep (code not_assignee) }
        "409": { description: The row moved or changed in the sheet (code row_moved) — refresh }
        "422": { description: Unknown status (code invalid_status) }

  /preps/{prepId}/interview:
    post:
      tags: [preps]
      x-phase: P4
      summary: Record the interview check in "Candidate's Status" (any roster member).
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, maxLength: 80, description: "One of PrepDetail.interviewStatusOptions, or free text" }
      responses:
        "200": { description: The updated prep, content: { application/json: { schema: { $ref: "#/components/schemas/PrepDetail" } } } }
        "409": { description: The row moved or changed (code row_moved) }

  /preps/{prepId}/assign:
    post:
      tags: [preps]
      x-phase: P4
      summary: Set "Prep given by". Take an unassigned prep / hand back your own; leads and admins assign anyone.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails: { type: array, maxItems: 4, items: { type: string, format: email }, description: "[] unassigns" }
      responses:
        "200": { description: The updated prep, content: { application/json: { schema: { $ref: "#/components/schemas/PrepDetail" } } } }
        "403": { description: Assigning someone else without being a lead (code lead_only) }
        "422": { description: Someone isn't on the roster (code invalid_assignees) }

  /preps/jobs/{jobId}:
    get:
      tags: [preps]
      x-phase: P4
      summary: One job's interviews (company view) — rounds funnel, candidates, links.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "404": { $ref: "#/components/responses/NotFound" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [jobId, company, companies, process, rounds, items, links]
                properties:
                  jobId: { type: string }
                  company: { type: string }
                  companies: { type: array, items: { type: string } }
                  process: { type: array, items: { type: string } }
                  rounds:
                    type: array
                    items:
                      type: object
                      properties:
                        round: { type: string }
                        total: { type: integer }
                        selected: { type: integer }
                        rejected: { type: integer }
                        pending: { type: integer }
                  items: { type: array, items: { $ref: "#/components/schemas/PrepItem" } }
                  links: { type: array, items: { $ref: "#/components/schemas/DocLink" } }


  # ── Prep document, Google Meet, guidance sessions, call recordings (team Google account) ───
  # Any route that needs the team account answers 503 with code team_not_connected,
  # team_reconnect (permission revoked, e.g. password change) or team_not_configured.
  # Call transcripts, summaries and messages are written to the drill-down row only (columns past
  # Z: Prep Call Recording / Transcript / Summary / Duration, Prep Messages); the API never returns them.

  /preps/{prepId}/documents:
    get:
      tags: [prep-document]
      x-phase: P5
      summary: "The job + round's prep document(s) and what they can be built from."
      description: >
        { prepId, candidate, phone, company, round, documents: [PrepDocument], sources: [DocLink], sections: [{id,label}],
        website, linkedin, google: {connected, account, status}, notion: {configured}, run: DocRun|null, whatsapp: string (the
        WhatsApp text with the document link) }. PrepDocument = { id, kind: gdoc|notion, url, title, version, round, updatedAt,
        updatedBy, sections, status: up_to_date|update_available, reasons, lastChanges, unverified }.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [prep-document]
      x-phase: P5
      summary: Create the job + round's prep document, or rewrite it when one exists (its current text — manual edits included — is read first). Runs in the background, ~1 min.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [gdoc, notion], default: gdoc }
                sources: { type: array, items: { type: string, format: uri }, description: "Drill-down / transcript urls from GET documents' sources; omitted = all" }
                website: { type: string, format: uri }
                linkedin: { type: string, format: uri }
                sections: { type: array, items: { type: string, enum: [overview, start_here, about_company, topics, checklist, summary] }, description: "topics is required" }
      responses:
        "202": { description: "The run (poll /preps/runs/{runId}) — the same run when one is already in progress" }
        "422": { description: "no_sources / invalid_sections" }
        "503": { description: "team_not_connected / notion_not_configured" }

  /preps/{prepId}/documents/edit-access:
    post:
      tags: [prep-document]
      x-phase: P5
      summary: "Edit by hand: the signed-in person (roster email + linked Google accounts) gets edit access to the round's Google Doc. { url, title, emails }."
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }
        "404": { description: "no_document" }
        "502": { description: "share_failed" }

  /preps/runs/{runId}:
    get:
      tags: [prep-document]
      x-phase: P5
      summary: "Progress of a document run: { id, status: queued|running|done|failed, step, error, mode: create|update, kind, result: { url, title, changes, unverified, sections, model, skipped }, createdAt }."
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /preps/{prepId}/meeting-setup:
    get:
      tags: [meetings]
      x-phase: P5
      summary: "For the Meet scheduler: { prepId, jobKey, candidate, company, round, phone, interviewWhen, google: {connected, account, status}, email: {prep,mock,guidance,custom: {subject, body}}, whatsapp: {prep,mock,guidance,custom}, placeholders: [\"{meet_link}\", \"{when}\"], meetings: [Meeting] }."
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /preps/{prepId}/contact:
    get:
      tags: [meetings]
      x-phase: P5
      summary: "The candidate's email, in order: 1) the company sheet (CRPs JOB ID + Company Sheet Link only, by phone then exact name); 2) if not there or no company sheet, the internal assessment sheets (by phone); 3) if in neither, the resume. { email, status: found|ambiguous|not_found|no_company_sheet|unreadable, source, matchedBy: phone|name|assessment|resume, candidate }. Never guessed."
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }

  /preps/contacts:
    post:
      tags: [meetings]
      x-phase: P5
      summary: "Emails of the candidates picked for a guidance session (any jobs, ≤ 100): { items: [{ prepId, candidate, company, round, contact }] }."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [prepIds], properties: { prepIds: { type: array, maxItems: 100, items: { type: string } } } }
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /preps/jobs/{jobId}/contacts:
    get:
      tags: [meetings]
      x-phase: P5
      summary: "Every candidate of the job with the looked-up email: { items: [{ prepId, candidate, company, round, contact }] }."
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }

  /preps/{prepId}/messages:
    post:
      tags: [meetings]
      x-phase: P5
      summary: The app opened WhatsApp (wa.me) with a message — a line on the row's Prep Messages column ("opened"; no delivery receipt without the WhatsApp API).
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose: { type: string, enum: [prep_document, meeting_link, reminder, follow_up, custom] }
                to: { type: string }
      responses:
        "200": { description: "{ ok: true }" }

  /preps/{prepId}/recordings:
    post:
      tags: [call-recordings]
      x-phase: P5
      summary: Submit a prep call the phone recorded (≤ 40 MB). Saved to the team Drive before the response; the transcript and summary go to the row's Prep Call columns (never stored in the database); the real duration counts in /analytics/calls.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, callAt, durationSec, deviceKey]
              properties:
                file: { type: string, format: binary }
                callAt: { type: string, format: date-time }
                durationSec: { type: integer, minimum: 1, description: "From the file's own metadata" }
                deviceKey: { type: string, description: "Stable per file on the phone; the same key twice returns the call already submitted" }
      responses:
        "200": { description: "{ id, callAt, durationSec, status: transcribing }" }
        "413": { description: "recording_too_large" }
        "415": { description: "Not audio (invalid_recording)" }

  /meetings:
    get:
      tags: [meetings]
      x-phase: P5
      summary: "Meetings in a window (≤ 62 days): { items: [Meeting] }. Filters: prepId (matches guidance sessions that include it), jobId, mine=1."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: prepId, in: query, schema: { type: string } }
        - { name: jobId, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "OK" }
    post:
      tags: [meetings]
      x-phase: P5
      summary: One-tap meeting — calendar event + Meet link from the team account, Meet auto recording + transcript, email with a calendar invite now / at a time / not at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, startsAt, durationMin, attendees]
              properties:
                kind: { type: string, enum: [prep, guidance, mock, custom] }
                prepId: { type: string, description: "Required for prep / mock" }
                prepIds: { type: array, maxItems: 100, items: { type: string }, description: "Guidance (or custom) for several candidates: each row gets the emails and, after the call, its transcript and summary" }
                jobId: { type: string, description: "Guidance for a whole job" }
                company: { type: string }
                title: { type: string }
                startsAt: { type: string, format: date-time }
                durationMin: { type: integer, minimum: 10, maximum: 240 }
                attendees: { type: array, maxItems: 100, items: { type: object, required: [email], properties: { email: { type: string, format: email }, name: { type: string } } } }
                record: { type: boolean, default: true }
                email:
                  type: object
                  properties:
                    mode: { type: string, enum: [now, scheduled, none] }
                    subject: { type: string }
                    body: { type: string, description: "{meet_link} and {when} are filled in" }
                    sendAt: { type: string, format: date-time }
                force: { type: boolean, description: "Schedule despite duplicate_meeting / meeting_conflict" }
      responses:
        "201": { description: "The Meeting: { id, kind, title, prepId, prepIds, jobKey, company, startsAt, endsAt, meetUrl, calendarUrl, record, recordingOn, attendees, status, email: {status, subject, sendAt, sentAt, error}, artifacts: {status, durationSec, recordingUrl, transcriptUrl}, createdBy, createdByName, whatsapp, warnings }" }
        "409": { description: "duplicate_meeting / meeting_conflict (send force to override)" }
        "422": { description: "invalid_meeting / invalid_attendee" }

  /meetings/bulk:
    post:
      tags: [meetings]
      x-phase: P5
      summary: "Several meetings at once (≤ 20): { items: [MeetingInput] } → { results: [{ ok, meeting?, error?, code? }] }."
      responses:
        "200": { description: "OK" }

  /meetings/{meetingId}:
    delete:
      tags: [meetings]
      x-phase: P5
      summary: Cancel — the calendar event is removed; guests who got the email get a cancellation (scheduler or admin).
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The Meeting (status cancelled)" }

  /meetings/{meetingId}/resend:
    post:
      tags: [meetings]
      x-phase: P5
      summary: Send the meeting email (with the invite) to every guest again.
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The Meeting" }

  /analytics/calls:
    get:
      tags: [call-recordings]
      x-phase: P5
      summary: "Prep calls per mentor from the real durations (submitted phone calls + Meet prep / mock / guidance calls): { from, to, members: [{ email, name, calls, totalSec, avgSec, phoneCalls, meetCalls }], team: { calls, totalSec, avgSec }, daily: [{ day, calls, totalSec }] }. Admins / leads see everyone."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: "OK" }

  /admin/integrations:
    get:
      tags: [admin]
      x-phase: P5
      summary: "Team Google account and Notion status (admin): { google: TeamStatus, notion: { configured, ok, error } }."
      responses:
        "200": { description: "OK" }
        "403": { description: "admin_only" }

  /admin/integrations/google/start:
    post:
      tags: [admin]
      x-phase: P5
      summary: "A 10-minute link that opens Google's consent screen for the team account: { url, account, configured }. Open it signed in as the team account."
      responses:
        "200": { description: "OK" }
        "403": { description: "admin_only" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/google or /auth/refresh (15 min). On 401, refresh once, then sign out.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, description: "Opaque id of an assignment (one control row)" }
    PrepId:
      name: prepId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{24}$", description: "Stable id of a drill-down row (candidate phone + job + round)" }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or invalid token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found, or not visible to this user
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: What happened and how to fix it (shown to the user) }
        code: { type: string }

    DeviceInfo:
      type: object
      required: [platform, appVersion]
      properties:
        platform: { type: string, enum: [android] }
        appVersion: { type: string }
        osVersion: { type: integer, description: Android API level }
        model: { type: string }
        fcmToken: { type: string }

    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [member, lead, admin] }
        teamsLinked: { type: boolean }

    RosterEntry:
      type: object
      required: [email, name, role, active]
      properties:
        email: { type: string, format: email }
        name: { type: string, description: "The value in the control sheet's Mentor dropdown (e.g. Hemanth)" }
        aliases: { type: array, items: { type: string }, description: Other spellings seen in the sheet }
        role: { type: string, enum: [member, lead, admin] }
        lead: { type: string, format: email, description: Who gets this member's escalations }
        active: { type: boolean }
        signInEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email }
          description: |
            Other Google accounts this person may sign in with (e.g. a Gmail account that mirrors
            their work account). Signing in with one opens this person's session: same tasks, role
            and notifications. Each account belongs to one person and can't be a roster email.
            On PUT, omit to keep the stored list; [] removes all (their devices are signed out).

    TaskState:
      type: string
      enum: [new, acknowledged, screening, shortlist_ready, shared, overdue, done]
      description: |
        new → acknowledged (Start now) → screening (job running) → shortlist_ready (AI delivered)
        → shared (sent to company) → done. "overdue" applies to any open state past the deadline.

    TaskSummary:
      type: object
      required: [id, company, profilesRequired, state]
      properties:
        id: { type: string }
        company: { type: string }
        techStack: { type: string }
        profilesRequired: { type: integer }
        assignedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        deadlineInferred: { type: boolean, description: "True when the time was ambiguous in the sheet (e.g. 3:00 read as 15:00). The app shows it for confirmation." }
        state: { $ref: "#/components/schemas/TaskState" }
        assignee: { type: string, format: email }
        jobId: { type: string, format: uuid }
        ackAt: { type: string, format: date-time }

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          properties:
            product: { type: string }
            pc: { type: string, description: Placement coordinator (sheet column PC) }
            crm: { type: string }
            hubspotUrl: { type: string, format: uri }
            remarks: { type: string, description: Company / shortlisting remarks }
            jdUrl: { type: string, format: uri }
            internalSheetUrl: { type: string, format: uri }
            openings: { type: string }
            proposedMechanism: { type: string }
            lastConfig: { $ref: "#/components/schemas/ScreeningConfig" }
            sheetRowUrl: { type: string, format: uri, description: Link to the row in the EDGE sheet }

    ScreeningConfig:
      type: object
      required: [subsheets, focus, github, dsa, topN]
      description: Serialised to the control row's Subsheets / Screening Instructions / Github / DSA / Experience cells.
      properties:
        subsheets: { type: array, minItems: 1, items: { type: string } }
        focus: { type: string, maxLength: 4000 }
        mustHaves: { type: array, items: { type: string }, description: '"X or Y" is one item' }
        github: { type: string, enum: [off, fit, all], description: "fit = domain-fit candidates only (default)" }
        codeReview: { type: boolean, default: true }
        dsa:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            minRating:
              type: object
              properties:
                codeforces: { type: integer }
                codechef: { type: integer }
                leetcode: { type: integer }
            minSolved: { type: integer }
            minContests: { type: integer }
            minScore: { type: integer }
        experience: { type: string, description: Free text as in "Experience in Screening Domain" }
        topN: { type: integer, minimum: 1, maximum: 500 }

    Estimate:
      type: object
      required: [profiles, earlyShortlistMinutes, fullMinutes, queueAhead]
      properties:
        profiles: { type: integer, description: Rows that will be read }
        withResume: { type: integer }
        earlyShortlistMinutes: { type: integer }
        fullMinutes: { type: integer }
        queueAhead: { type: integer }
        basis: { type: string, description: "e.g. 'median of the last 10 jobs'" }

    JobStatus:
      type: string
      enum: [pending, processing, completed, failed, awaiting_review]

    Job:
      type: object
      required: [id, status, step, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string }
        company: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        step: { type: string, description: "planner / screening / evaluation / validation / delivery, or a finer checkpoint" }
        progress:
          type: object
          properties:
            total: { type: integer }
            screened: { type: integer }
            shortlisted: { type: integer }
            githubChecked: { type: integer }
        queueAhead: { type: integer }
        stopRequested: { type: boolean }
        earlyShortlistAt: { type: string, format: date-time, description: When the shortlist was first delivered (before the full screening finished) }
        deliveredTabUrl: { type: string, format: uri }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    ShortlistCandidate:
      type: object
      required: [key, rank, name, score]
      properties:
        key: { type: string, description: Mobile number key }
        rank: { type: integer }
        name: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        signals: { type: array, items: { type: string } }
        mustHaves:
          type: array
          items:
            type: object
            required: [item, met]
            properties:
              item: { type: string }
              met: { type: boolean }
              evidence: { type: string }
        githubUrl: { type: string, format: uri }
        resumeUrl: { type: string, format: uri }
        dsa: { type: string, description: Short summary, e.g. "CF 1612 · LC 420 solved" }
        standing: { type: string, description: Eligible-pool standing / Job Eligibility tag }
        conflicts: { type: array, items: { type: string }, description: "e.g. shared with another company this week" }
        decision: { type: string, enum: [share, hold, reject] }

    Analytics:
      type: object
      description: |
        Real numbers from the control sheet and the screening jobs. A row belongs to the range by its
        Assigned Date & Time (else its deadline). A delivered shortlist is the early delivery or the
        job's end, whichever came first. Rows nobody was assigned in the app are only judged on time
        when a screening delivered.
      required: [scope, totals, byMember, rows]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        scope: { type: string, enum: [mine, team] }
        syncedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            tasks: { type: integer }
            assigned: { type: integer }
            started: { type: integer, description: Rows with a screening job }
            running: { type: integer }
            delivered: { type: integer }
            failed: { type: integer }
            profilesRequired: { type: integer }
            profilesRead: { type: integer, description: Candidates the AI read }
            shortlisted: { type: integer }
            medianMinutesToShortlist: { type: integer, nullable: true }
            onTimePercent: { type: integer, nullable: true }
            overdue: { type: integer, description: "Assigned, past the deadline, no shortlist yet" }
        byMember:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              email: { type: string, format: email, nullable: true }
              tasks: { type: integer }
              started: { type: integer }
              delivered: { type: integer }
              onTime: { type: integer }
              overdue: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [taskId, company, profilesRequired, sheetRowUrl]
            properties:
              taskId: { type: string }
              company: { type: string }
              mentor: { type: string, nullable: true }
              mentorEmail: { type: string, format: email, nullable: true }
              profilesRequired: { type: integer, description: 'Upper bound when the sheet says a range ("10-15" → 15)' }
              assignedAt: { type: string, format: date-time, nullable: true }
              deadline: { type: string, format: date-time, nullable: true }
              acknowledgedAt: { type: string, format: date-time, nullable: true }
              jobStatus: { type: string, nullable: true, enum: [pending, processing, completed, failed, awaiting_review] }
              profilesRead: { type: integer, nullable: true }
              shortlisted: { type: integer, nullable: true }
              deliveredAt: { type: string, format: date-time, nullable: true }
              minutesToShortlist: { type: integer, nullable: true }
              onTime: { type: boolean, nullable: true }
              shortlistUrl: { type: string, format: uri, nullable: true }
              sheetRowUrl: { type: string, format: uri }

    PrepStatus:
      type: string
      enum: [pending, done, missed, not_needed, not_informed, no_response, rescheduled, cancelled, other]
      description: 'Column M "Prep Given". pending = empty. Writes use the team spellings (Yes, Missed, Not needed, DNP …).'
    PrepTag:
      type: object
      required: [label, tone, group]
      properties:
        label: { type: string }
        tone: { type: string, enum: [pass, fail, neutral] }
        group: { type: string, description: "Academy, Edge 2.0, Edge 1.0, Marks, Sheet" }
    PrepItem:
      type: object
      required: [id, company, candidate, category, prepStatus, interviewState, mentors, mine, slaKind]
      properties:
        id: { type: string }
        row: { type: integer, description: "1-based sheet row when read (rows move; id is stable)" }
        company: { type: string }
        jobId: { type: string }
        candidate: { type: string }
        phone: { type: string, description: "10 digits, or empty" }
        round: { type: string }
        interviewDay: { type: [string, "null"], format: date }
        interviewStart: { type: [string, "null"], format: date-time, description: "Null when the sheet has no readable time" }
        interviewEnd: { type: [string, "null"], format: date-time }
        interviewTimeText: { type: string, description: "The timings cell when it couldn't be read" }
        interviewTbd: { type: boolean }
        category: { type: string, enum: [academy, edge, external] }
        edgeVersion: { type: [string, "null"], enum: ["1.0", "2.0", null] }
        stage: { type: string, description: "TR-2 cleared, Assessment cleared, Assessed · not in pool …" }
        tags: { type: array, items: { $ref: "#/components/schemas/PrepTag" } }
        mentors:
          type: array
          items: { type: object, properties: { name: { type: string }, email: { type: [string, "null"] } } }
        mine: { type: boolean }
        prepStatus: { $ref: "#/components/schemas/PrepStatus" }
        prepStatusText: { type: string }
        candidateStatus: { type: string }
        interviewState: { type: string, enum: [scheduled, completed, rescheduled, cancelled, no_show, next_round, selected, rejected, hold, other] }
        dueAt: { type: [string, "null"], format: date-time }
        slaKind: { type: string, enum: [mandatory, before_interview, none] }
        informedLate: { type: boolean, description: "ISE / PC entered it less than 24 h before the interview" }
        firstSeenAt: { type: [string, "null"], format: date-time }
        doneAt: { type: [string, "null"], format: date-time }
        mode: { type: string }
        hasResume: { type: boolean }
        hasLinks: { type: boolean }
    PrepStats:
      type: object
      properties:
        openToday: { type: integer }
        openTomorrow: { type: integer }
        overdue: { type: integer }
        unassigned: { type: integer }
        interviewsToday: { type: integer }
        doneToday: { type: integer }
        week: { type: object, properties: { done: { type: integer }, onTime: { type: integer } } }
    DocLink:
      type: object
      required: [url, kind]
      properties:
        url: { type: string }
        kind: { type: string, enum: [drilldown, transcript] }
        title: { type: string }
        updatedAt: { type: [string, "null"], format: date-time, description: "The Drive file's last change, when the server can see it" }
        own: { type: boolean, description: "From this candidate's own row" }
        seenOn:
          type: array
          items: { type: object, properties: { round: { type: string }, interviewDay: { type: [string, "null"] }, candidate: { type: string } } }
    PrepDetail:
      allOf:
        - $ref: "#/components/schemas/PrepItem"
        - type: object
          properties:
            source: { type: string, enum: [pool, assessed, sheet, none] }
            entryDay: { type: [string, "null"], format: date }
            resumeUrl: { type: string }
            process: { type: array, items: { type: string } }
            prepDay: { type: [string, "null"], format: date }
            prepTime: { type: string }
            prepDocument: { type: string }
            remarks: { type: string }
            hubspotUrl: { type: string }
            meetingUrl: { type: string }
            recordingUrl: { type: string }
            recordingNote: { type: string }
            completion: { type: string }
            links: { type: array, items: { $ref: "#/components/schemas/DocLink" } }
            journey:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  company: { type: string }
                  round: { type: string }
                  interviewDay: { type: [string, "null"] }
                  candidateStatus: { type: string }
                  interviewState: { type: string }
                  prepStatus: { $ref: "#/components/schemas/PrepStatus" }
            activity:
              type: array
              items: { type: object, properties: { at: { type: string, format: date-time }, by: { type: string }, action: { type: string }, value: { type: string } } }
            canEdit: { type: boolean }
            interviewStatusOptions: { type: array, items: { type: string } }

    PushMessage:
      description: |
        FCM **data** message (not a notification message), so the app always builds the notification
        itself: sticky assignment with countdown, re-post on swipe. High priority for assignment,
        reminder and overdue; normal for job updates.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [assignment, reminder, overdue, escalation, job_update, test, prep_assigned, prep_reminder, prep_overdue, prep_escalation, prep_unassigned, interview_checkin, prep_digest, prep_doc_ready, recording_ready, meeting_reminder, team_account]
        taskId: { type: string, description: "Task pushes" }
        prepId: { type: string, description: "Prep pushes (prep_*, interview_checkin) prep_doc_ready, recording_ready (the call was added to the sheet), meeting_reminder (when the meeting is a prep's)" }
        meetingId: { type: string, description: "meeting_reminder, recording_ready (Meet)" }
        meetUrl: { type: string, format: uri, description: "meeting_reminder: the Join action" }
        url: { type: string, format: uri, description: "prep_doc_ready: the document" }
        candidate: { type: string }
        round: { type: string }
        category: { type: string, enum: [academy, edge, external] }
        edgeVersion: { type: string }
        interviewDay: { type: string, format: date }
        interviewStart: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        digest: { type: string, enum: [morning, evening] }
        jobId: { type: string }
        company: { type: string }
        profilesRequired: { type: string }
        deadline: { type: string, format: date-time }
        jobStatus: { $ref: "#/components/schemas/JobStatus" }
        earlyShortlist: { type: string, enum: ["true", "false"] }
        title: { type: string }
        body: { type: string }
