  # ── Prep document, Google Meet, guidance sessions, call recordings (team Google account) ───
  # Any route that needs the team account answers 503 with code team_not_connected,
  # team_reconnect (permission revoked, e.g. password change) or team_not_configured.
  # Call transcripts, summaries and messages are written to the drill-down row only (columns past
  # Z: Prep Call Recording / Transcript / Summary / Duration, Prep Messages); the API never returns them.

  /preps/{prepId}/documents:
    get:
      tags: [prep-document]
      x-phase: P5
      summary: "The job + round's prep document(s) and what they can be built from."
      description: >
        { prepId, candidate, phone, company, round, documents: [PrepDocument], sources: [DocLink + tabs?: [{id,title,level}] (Google Docs with
        several tabs, often one per round) + tabsUnknown?: true (tabs couldn't be read; the whole document is used)], sections: [{id,label}],
        website, linkedin, google: {connected, account, status}, notion: {configured}, run: DocRun|null, whatsapp: string (the
        WhatsApp text with the document link), researchPlan: { company, role, round, queries: [string], suppliedLinks: [string] }
        (what company research would search — the app shows it and the mentor confirms before anything is searched) }.
        sources[].kind is drilldown | transcript | rsa (an RSA document of an earlier candidate for the same company AND round).
        PrepDocument = { id, kind: gdoc|notion, url, title, version, round, updatedAt,
        updatedBy, sections, status: up_to_date|update_available, reasons, lastChanges, unverified }.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [prep-document]
      x-phase: P5
      summary: Create the job + round's prep document, or rewrite it when one exists (its current text — manual edits included — is read first). Runs in the background, ~1 min.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [gdoc, notion], default: gdoc }
                sources: { type: array, items: { type: string, format: uri }, description: "Drill-down / transcript urls from GET documents' sources; omitted = all" }
                website: { type: string, format: uri }
                linkedin: { type: string, format: uri }
                sections: { type: array, items: { type: string, enum: [overview, start_here, about_company, topics, checklist, summary] }, description: "topics is required" }
                tabs: { type: object, additionalProperties: { type: array, items: { type: string } }, description: "{ [source url]: [tab id] } — required (at least one tab) for every chosen source that lists tabs; only those tabs are read" }
                research: { type: string, enum: ["on", "off"], default: "off", description: "on = the mentor confirmed researchPlan; only questions from sources that name the company are used, and the sources line lists only pages the search returned. Absent = off." }
      responses:
        "202": { description: "The run (poll /preps/runs/{runId}) — the same run when one is already in progress. Documents use format v2 (the team's master prompt): title block, overview, START HERE, [About], numbered sections with real vs practice questions, checklist, IN SHORT, [sources]; at most 7 pages." }
        "422": { description: "no_sources / no_tabs / invalid_sections" }
        "503": { description: "team_not_connected / notion_not_configured" }

  /preps/{prepId}/documents/edit-access:
    post:
      tags: [prep-document]
      x-phase: P5
      summary: "Edit by hand: the signed-in person (roster email + linked Google accounts) gets edit access to the round's Google Doc. { url, title, emails }."
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
