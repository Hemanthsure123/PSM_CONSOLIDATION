        "200": { description: "The key", content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "403": { description: "admin_only" }
        "404": { description: "not_found" }
        "409": { description: "duplicate_key" }
        "422": { description: "invalid_key" }
