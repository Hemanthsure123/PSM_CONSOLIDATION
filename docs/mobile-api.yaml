    ShareStatus:
      type: string
      description: "1.12.0. The chip to show. From the Final Status when decisive, else the latest decisive round (rejected, no show, on hold, closed, selected, cleared); weak values (Done, Completed, Attended, Waiting for results, Scheduled, Yet to schedule) never reopen a rejection, and after a cleared round say what is happening now (awaiting a result, or the next round). Then the requirement's master state: an open status at a closed requirement is closed, at a requirement on hold on_hold. applied = an applications-tab row with nothing filled in; shared = nothing filled in."
