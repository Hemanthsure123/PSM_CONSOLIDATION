        syncedAt: { type: [string, "null"], format: date-time }
        interviewsAvailable: { type: boolean }
        summary:
          type: object
          description: "1.10.0. Header numbers. shared / neverShared are 0 until the shares were synced once."
          properties:
            total: { type: integer }
            assigned: { type: integer }
            unassigned: { type: integer }
            shared: { type: integer, description: "Candidates in at least one company sheet" }
            neverShared: { type: integer }
            inProcess: { type: integer, description: "Candidates whose stage is in_process" }
            selected: { type: integer, description: "Candidates whose stage is selected" }
            upcomingInterviews: { type: integer, description: "Scheduled drill-down interviews from today on (sum of items[].interviews.upcoming)" }
        groups:
          type: array
          description: "1.10.0. The caller's own group first (only when they have candidates), then the other mentors A–Z, then unassigned."
          items:
            type: object
            properties:
              key: { type: string, description: "The mentor's email, name:<lower name> for a sheet mentor not on the roster, or unassigned" }
