  /preps/{prepId}/recordings:
    post:
      tags: [call-recordings]
      x-phase: P5
      summary: Submit a prep call the phone recorded (≤ 40 MB). Saved to the team Drive before the response; the transcript and summary go to the row's Prep Call columns (never stored in the database); the real duration counts in /analytics/calls.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, callAt, durationSec, deviceKey]
              properties:
                file: { type: string, format: binary }
                callAt: { type: string, format: date-time }
                durationSec: { type: integer, minimum: 1, description: "From the file's own metadata" }
                deviceKey: { type: string, description: "Stable per file on the phone; the same key twice returns the call already submitted" }
      responses:
        "200": { description: "{ id, callAt, durationSec, status: transcribing }" }
        "413": { description: "recording_too_large" }
        "415": { description: "Not audio (invalid_recording)" }

  /preps/{prepId}/rsa:
    get:
      tags: [rsa]
      x-phase: P7
      summary: "The prep's RSA (Rejection Selection Analysis) document and what it is built from."
      description: >
        { prepId, candidate, company, round, phone, product, drilldowns: [DocLink + tabs?/tabsUnknown?] (the job's drill-downs, own first),
        resumeUrl (the row's resume link, or the one the RSA used), rsa: null | { id, url, title, version, updatedAt, updatedBy (name),
        drilldownUrl, tabs, resumeUrl, remarks, sheetStatus: pending|added|exists|failed, sheetError, unconfirmed: [string] },
        hasRecording (a recording is already saved: an update or retry may omit it), run: RsaRun|null, google: {connected, account, status},
        preparedBy (the signed-in member's name) }.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      responses:
        "200": { description: "OK" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [rsa]
      x-phase: P7
      summary: >
        Create the RSA document, or update it in place (same Google Doc, same link, no second row in the RSA sheet). Generated only from the
        drill-down, the call recording, the resume and the remarks (remarks take priority). Files are saved to the team Drive before the
        response; the transcript is kept in Drive, never in the database. Runs in the background, about a minute.
      parameters: [{ $ref: "#/components/parameters/PrepId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [drilldownUrl]
              properties:
                drilldownUrl: { type: string, format: uri, description: "One of GET rsa's drilldowns" }
                tabs: { type: string, description: "JSON array of tab ids — required when the drill-down lists tabs" }
                recording: { type: string, format: binary, description: "The RSA call (audio, ≤ 40 MB). Required unless hasRecording" }
                callAt: { type: string, format: date-time }
                resumeUrl: { type: string, format: uri, description: "The resume the company has (or send resume)" }
                resume: { type: string, format: binary, description: "PDF or .docx, ≤ 10 MB (or send resumeUrl)" }
                remarks: { type: string, maxLength: 4000 }
      responses:
        "202": { description: "RsaRun (poll /preps/rsa-runs/{runId}) — the same run when one is already in progress" }
        "413": { description: "recording_too_large / resume_too_large / upload_too_large" }
        "415": { description: "invalid_recording / invalid_resume" }
        "422": { description: "no_drilldown / invalid_drilldown / no_tabs / no_resume / no_recording / remarks_too_long" }
        "409": { description: "run_in_progress (another run for this prep just started)" }
        "502": { description: "drive_failed (the recording or resume couldn't be saved to the team Drive; nothing was started)" }
