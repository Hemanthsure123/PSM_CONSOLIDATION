        "404": { description: "not_found" }

  /admin/api-keys/{keyId}/test:
    post:
      tags: [admin]
      x-phase: P8
      summary: "Admins only. Checks the saved key with its provider again (read-only, no usage spent)."
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The key with its new status", content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "403": { description: "admin_only" }
        "404": { description: "not_found" }
        "409": { description: "key_unreadable (saved by another server: paste it again)" }

  /admin/notices:
    get:
      tags: [admin]
      x-phase: P8
      summary: "Admins only. Sticky notices sent lately (newest first, at most 100), with who acknowledged."
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/NoticeList" } } } }
        "403": { description: "admin_only" }
    post:
      tags: [admin]
      x-phase: P8
      summary: "Admins only. Sends a sticky notice to one active team member: push type admin_notice; it stays on their phone until they tap Acknowledge."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, title, body]
              properties:
                to: { type: string, format: email, description: "An active roster email" }
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 1000 }
      responses:
        "201": { description: "The notice (delivered = phones the push reached; 0 = they see it when they open the app)", content: { application/json: { schema: { $ref: "#/components/schemas/Notice" } } } }
        "403": { description: "admin_only" }
        "422": { description: "invalid_recipient / no_title / no_body" }

  /feedback:
    post:
      tags: [me]
      x-phase: P9
      summary: "Anyone signed in. Report feedback (Me → Report feedback). Every active admin gets a `feedback` push (a heads-up notification)."
      description: |
        Stored in app.feedback (migration 019, kept 365 days). The push to each admin carries
        `feedbackId`, `from` (the sender's name), `category`, `title` = "Feedback from <Name> ·
        <Problem|Idea|Other>" and `body` = the first 300 characters of the message; dedupe key
        `feedback:<id>:<admin email>`. Rate limit: 10 per person per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: { type: string, enum: [problem, idea, other] }
                message: { type: string, minLength: 1, maxLength: 2000, description: "Trimmed; line breaks kept" }
                screen: { type: string, maxLength: 100, description: "Where the person was (e.g. Tasks, Prep detail)" }
                appVersion: { type: string, maxLength: 40 }
                device: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "400": { description: "invalid_body" }
        "422": { description: "invalid_category / no_message (empty after trimming) / too_long (over 2000 characters)" }
        "429": { description: "too_many: more than 10 in the last hour" }
        "503": { description: "not_ready: migration 019 isn't applied yet" }

  /admin/feedback:
    get:
      tags: [admin]
      x-phase: P9
      summary: "Admins only. The team's feedback, newest first (up to 200), and how many are unread (of all)."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackList" } } } }
        "403": { description: "admin_only" }

  /admin/feedback/{id}/read:
    post:
      tags: [admin]
      x-phase: P9
      summary: "Admins only. Marks one feedback item read. Idempotent: a second call answers with the first time."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, readAt]
                properties:
                  id: { type: string, format: uuid }
                  readAt: { type: string, format: date-time }
        "403": { description: "admin_only" }
        "404": { description: "not_found" }

  /me/notices:
    get:
      tags: [me]
      x-phase: P8
      summary: "The signed-in person's notices not acknowledged yet (at most 20). The phone re-shows each one (app start, resume, after sign-in) and removes those closed elsewhere."
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/NoticeList" } } } }

  /me/notices/{noticeId}/ack:
    post:
      tags: [me]
      x-phase: P8
      summary: "Acknowledges a notice. Idempotent: a second call answers with the first time."
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  acknowledgedAt: { type: string, format: date-time }
        "404": { description: "not_found (not this person's, or deleted: the app treats it as acknowledged)" }

  /app/releases/latest:
    get:
      tags: [app]
      x-phase: P8
      summary: "The newest app version for in-app updates (no Play Store), or null. Phones below minSupported must update before using the app. Push type app_update (versionCode, versionName, title, body) when one is published."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  release:
                    oneOf:
                      - { $ref: "#/components/schemas/AppRelease" }
                      - { type: "null" }

  /app/releases/{versionCode}/apk:
    get:
      tags: [app]
      x-phase: P8
      summary: "The APK in parts of at most 8 MB. Send Range: bytes=<start>- and keep asking from the next byte until the total: 206 with Content-Range: bytes start-end/total, or 200 when the first part is the whole file. X-Content-SHA256 = the whole file's hash (the app checks it before installing)."
      parameters:
        - { name: versionCode, in: path, required: true, schema: { type: integer } }
        - { name: Range, in: header, required: false, schema: { type: string, example: "bytes=8388608-" } }
      responses:
        "200": { description: "The whole APK (application/vnd.android.package-archive)" }
        "206": { description: "A part" }
        "404": { description: "not_found (only the newest 3 releases keep their file)" }
        "416": { description: "range_not_satisfiable" }

  /meetings:
    get:
      tags: [meetings]
      x-phase: P5
      summary: "Meetings in a window (≤ 62 days): { items: [Meeting] }. Filters: prepId (matches guidance sessions that include it), jobId, mine=1."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: prepId, in: query, schema: { type: string } }
        - { name: jobId, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "OK" }
    post:
      tags: [meetings]
      x-phase: P5
      summary: One-tap meeting — calendar event + Meet link from the team account, Meet auto recording + transcript, email with a calendar invite now / at a time / not at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, startsAt, durationMin, attendees]
              properties:
                kind: { type: string, enum: [prep, guidance, mock, custom] }
                prepId: { type: string, description: "Required for prep / mock" }
                prepIds: { type: array, maxItems: 100, items: { type: string }, description: "Guidance (or custom) for several candidates: each row gets the emails and, after the call, its transcript and summary" }
                poolIds: { type: array, maxItems: 100, items: { type: string }, description: "Academy priority pool candidates (UIDs): mock (exactly one), guidance or custom. No prep needed; nothing is written to any sheet. 1.10.0: every candidate must be one the caller may change (their own; leads and admins: all), else 403 not_your_candidate. A mock / guidance meet sends pool_meeting to each candidate's mentor who isn't the caller." }
                jobId: { type: string, description: "Guidance for a whole job" }
                company: { type: string }
                title: { type: string }
                startsAt: { type: string, format: date-time }
                durationMin: { type: integer, minimum: 10, maximum: 240 }
                attendees: { type: array, maxItems: 100, items: { type: object, required: [email], properties: { email: { type: string, format: email }, name: { type: string } } } }
                record: { type: boolean, default: true }
                email:
                  type: object
                  properties:
                    mode: { type: string, enum: [now, scheduled, none] }
                    subject: { type: string }
                    body: { type: string, description: "{meet_link} and {when} are filled in" }
                    sendAt: { type: string, format: date-time }
                force: { type: boolean, description: "Schedule despite duplicate_meeting / meeting_conflict" }
      responses:
        "201": { description: "The Meeting: { id, kind, title, prepId, prepIds, poolIds, jobKey, company, startsAt, endsAt, meetUrl, calendarUrl, record, recordingOn, attendees, status, email: {status, subject, sendAt, sentAt, error}, artifacts: {status, durationSec, recordingUrl, transcriptUrl}, createdBy, createdByName, whatsapp, warnings }" }
        "403": { description: "not_your_candidate (1.10.0): a poolIds candidate isn't the caller's (leads and admins may schedule for anyone)" }
        "409": { description: "duplicate_meeting / meeting_conflict (send force to override)" }
        "422": { description: "invalid_meeting / invalid_attendee" }

  /meetings/bulk:
    post:
      tags: [meetings]
      x-phase: P5
      summary: "Several meetings at once (≤ 20): { items: [MeetingInput] } → { results: [{ ok, meeting?, error?, code? }] }."
      responses:
        "200": { description: "OK" }

  /meetings/{meetingId}:
    delete:
      tags: [meetings]
      x-phase: P5
      summary: Cancel — the calendar event is removed; guests who got the email get a cancellation (scheduler or admin).
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The Meeting (status cancelled)" }

  /meetings/{meetingId}/resend:
    post:
      tags: [meetings]
      x-phase: P5
      summary: Send the meeting email (with the invite) to every guest again.
      parameters:
        - { name: meetingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The Meeting" }

  /analytics/calls:
    get:
      tags: [call-recordings]
      x-phase: P5
      summary: "Prep calls per mentor from the real durations (submitted phone calls + Meet prep / mock / guidance calls): { from, to, members: [{ email, name, calls, totalSec, avgSec, phoneCalls, meetCalls }], team: { calls, totalSec, avgSec }, daily: [{ day, calls, totalSec }] }. Admins / leads see everyone."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: "OK" }

  /admin/integrations:
    get:
      tags: [admin]
      x-phase: P5
      summary: "Team Google account and Notion status (admin): { google: TeamStatus, notion: { configured, ok, error } }."
      responses:
        "200": { description: "OK" }
        "403": { description: "admin_only" }

  /admin/integrations/google/start:
    post:
      tags: [admin]
      x-phase: P5
      summary: "A 10-minute link that opens Google's consent screen for the team account: { url, account, configured }. Open it signed in as the team account."
      responses:
        "200": { description: "OK" }
        "403": { description: "admin_only" }

  /pool:
    get:
      tags: [pool]
      x-phase: P6
      summary: "Academy assessed pool: every assessed candidate, for everyone signed in (1.10.0). Read from the database (the sheet is copied every 10 minutes, the company sheets every hour). ETag-aware."
      description: |
        1.10.0:
        - **Everyone sees everyone.** `items` holds every Academy assessed candidate (the sheet's rows
          with a UID), assigned or not; `scope` is always `"all"`. An unassigned candidate has
          `mentor: { name: "", email: null }`.
        - Per item: `mine` (assigned to the caller), `canEdit` (the caller's own; leads and admins:
          all), `groupKey`, `shares` (company sheets, null when never synced) and `stage` (the most
          advanced outcome across companies: selected > in_process > on_hold > unknown > no_show >
          rejected; null when never shared).
        - Edits (PATCH /pool/{uid}, resumes, contact, meeting setup, POST /meetings with poolIds)
          stay limited to the assigned mentor, leads and admins: others get **403
          not_your_candidate**. The app shows edit actions only when `canEdit`.
        - New top-level `summary`, `groups` (the caller's own group first, only when they have
          candidates; then the other mentors A–Z; then `unassigned`) and `sharesSyncedAt`.
        - `mentors` is now sent to everyone; `unmatchedMentors` stays for admins and leads.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200": { description: "PoolList", content: { application/json: { schema: { $ref: "#/components/schemas/PoolList" } } } }
        "304": { description: "Unchanged" }

  /pool/sync:
    post:
      tags: [pool]
      x-phase: P6
      summary: "Re-read the Academy sheet now (at most once a minute): { status: succeeded|failed|skipped|fresh, syncedAt, added, updated, removed, issues, message? }. A failed read keeps the last copy."
      responses:
        "200": { description: "OK" }

  /pool/{uid}:
    get:
      tags: [pool]
      x-phase: P6
      summary: "One candidate (anyone signed in, 1.10.0) with every assessment attempt, interviews (EDGE drill-down by phone), resumes, meetings, history, rsaDocuments (past RSA documents by phone; empty = no RSA section), shares (every company sheet, newest activity first), mine and canEdit."
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "PoolDetail", content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
        "404": { description: "not_found (not in the pool)" }
    patch:
      tags: [pool]
      x-phase: P6
      summary: "The mentor's choices. Send only what changes; null clears priority / track. version = the version last seen."
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 0 }
                priority: { type: [string, "null"], enum: [p0, p1, p2, p3, null] }
                track: { type: [string, "null"], enum: [frontend, backend, fullstack, aiml, null] }
                tags: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
      responses:
        "200": { description: "PoolDetail" }
        "403": { description: "not_your_candidate (1.10.0): only the assigned mentor, leads and admins change a candidate" }
        "409": { description: "version_conflict: someone else changed the candidate first (refresh and retry)" }
        "422": { description: "invalid_priority / invalid_track / invalid_tags" }

  /pool/{uid}/contact:
    post:
      tags: [pool]
      x-phase: P6
      summary: "The user called / messaged / emailed the candidate from the app: { channel: call|whatsapp|email }. 204."
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Logged" }
        "403": { description: "not_your_candidate (1.10.0)" }

  /pool/{uid}/resumes:
    post:
      tags: [pool]
      x-phase: P6
      summary: "Add an updated resume (multipart: file = PDF/DOC/DOCX up to 10 MB, stack, best true|false, note?). Saved to the team Google Drive. Marking best unmarks the previous best of that stack."
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: "PoolDetail" }
        "403": { description: "not_your_candidate (1.10.0)" }
        "413": { description: "file_too_large" }
        "415": { description: "invalid_file" }
        "503": { description: "team_not_connected / team_reconnect" }

  /pool/resumes/{resumeId}:
    patch:
      tags: [pool]
      x-phase: P6
      summary: "{ stack?, best?, note? } -> PoolDetail"
      parameters:
        - { name: resumeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "PoolDetail" }
        "403": { description: "not_your_candidate (1.10.0)" }
    delete:
      tags: [pool]
      x-phase: P6
      summary: Remove (hidden; the Drive file is kept for audit) -> PoolDetail
      parameters:
        - { name: resumeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "PoolDetail" }
        "403": { description: "not_your_candidate (1.10.0)" }

  /pool/resumes/{resumeId}/file:
    get:
      tags: [pool]
      x-phase: P6
      summary: The resume file (Content-Type and Content-Disposition set), streamed through the server. Anyone signed in (1.10.0).
      parameters:
        - { name: resumeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "The file" }

  /pool/meeting-setup:
    post:
      tags: [pool]
      x-phase: P6
      summary: "{ ids: [uid] } -> { members: [{ uid, name, email, phone, track, mentor }], kinds, google: { connected, account, status }, email: { mock|guidance|custom: { subject, body } }, whatsapp: { mock|guidance|custom }, placeholders }. Then POST /meetings with poolIds."
      responses:
        "200": { description: "OK" }
        "403": { description: "not_your_candidate (1.10.0): one of the ids isn't the caller's candidate (leads and admins: anyone)" }

  /pool/shares/status:
    get:
      tags: [pool]
      x-phase: P7
      summary: "Admins (1.10.0). The company-sheet sync: the last run and the sheets the service account can't open, so the owner can share them."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lastRun, unreadable]
                properties:
                  lastRun:
                    type: [object, "null"]
                    properties:
                      startedAt: { type: string, format: date-time }
                      finishedAt: { type: [string, "null"], format: date-time }
                      status: { type: string, enum: [running, succeeded, failed] }
                      sheetsChecked: { type: integer, description: "Company sheets whose Drive modifiedTime was checked" }
                      sheetsRead: { type: integer, description: "Sheets read (changed, never read, or last read 24 h ago)" }
                      rowsMatched: { type: integer, description: "Academy assessed rows found in the sheets read" }
                      changes: { type: integer, description: "New shares, round / final-status changes and removals" }
                      errors: { type: integer, description: "Sheets that couldn't be read" }
                      error: { type: [string, "null"] }
                  unreadable:
                    type: array
                    items: { type: object, properties: { company: { type: string }, sheetUrl: { type: string, format: uri }, error: { type: string } } }
                  running: { type: boolean }
        "403": { description: "admin_only" }

  /pool/shares/sync:
    post:
      tags: [pool]
      x-phase: P7
      summary: "Admins (1.10.0). Re-check the company sheets now (Pool → Company sheets → Sync now). Answers 202 at once; the run goes on in the background (a few minutes). At most once every 5 minutes: { status: started | running | fresh, startedAt }."
      responses:
        "202": { description: "Accepted: { status: started | running | fresh, startedAt: date-time | null }" }
        "403": { description: "admin_only" }
        "503": { description: "not_ready: migration 020 isn't applied on the server" }

  /pool/companies:
    get:
      tags: [pool]
      x-phase: P7
      summary: "1.12.0. Every hiring drive Academy assessed candidates were sent to (a company sheet, or a master requirement without one): requirements from the CRPs master, the candidates found in the sheet with their status, verified-against-master checks, JD link or HubSpot nurturing remarks, tentative starts. Everyone sees everything; candidates[].mine marks the caller's. ETag-aware."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, companies]
                properties:
                  generatedAt: { type: string, format: date-time }
                  sharesSyncedAt: { type: [string, "null"], format: date-time }
                  companies: { type: array, items: { $ref: "#/components/schemas/Company" } }
        "304": { description: Unchanged (If-None-Match) }
        "503": { description: "not_ready: migration 022 isn't applied on the server" }

  /pool/companies/starts:
    get:
      tags: [pool]
      x-phase: P7
      summary: "1.12.0. Tentative process starts in [from, to] (each optional, at most 400 days), for the Calendar: { starts: [{ key, companyId, company, role, date, by, sheetUrl, crpLabel }] }."
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK }
        "400": { description: invalid_range }
        "503": { description: not_ready }

  /pool/companies/requirements/{key}/tentative-start:
    put:
      tags: [pool]
      x-phase: P7
      summary: "1.12.0. Sets ({\"date\": \"YYYY-MM-DD\"}, within two years of today) or clears ({\"date\": null}) a requirement's tentative process start. Any active member; audited. 200 { key, tentativeStart: { date, by, at } | null }."
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{24}$" } }
      responses:
        "200": { description: OK }
        "400": { description: invalid_date }
        "404": { description: "not_found: the requirement left the CRPs master" }
        "503": { description: not_ready }

  /pool/companies/export:
    get:
      tags: [pool]
      x-phase: P7
      summary: "1.12.0. The Companies list as an .xlsx (one row per requirement Academy candidates went to), with the screen's filters. Sheets: Companies (company, role, job type, CRP month / week, CTC, openings, Academy sent / assessed / non-assessed from the master, assessed found in the company sheet, check, outcome, master status / stage, JD link or HubSpot nurturing remarks and their source, HubSpot deal, company sheet, ISE, Tentative start date (editable), set by, Ref) and About (sources, definitions, sync times)."
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [in_progress, waiting, on_hold, done, active, all], default: all } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Requirements whose CRP period overlaps [from, to]" }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: mine, in: query, schema: { type: string, enum: ["0", "1"] } }
        - { name: sort, in: query, schema: { type: string, enum: [activity, ctc, openings, crp], default: ctc }, description: "ctc: CTC high → low, then openings" }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        "200": { description: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet (attachment)" }
        "400": { description: invalid_filter }
        "503": { description: not_ready }

  /pool/companies/import:
    post:
      tags: [pool]
      x-phase: P7
      summary: "1.12.0. multipart/form-data, field file: an exported .xlsx (at most 5 MB). Each row's Tentative start date (found by header, with its Ref) sets that requirement's tentative start; an empty cell changes nothing. 200 { applied, unchanged, unknown, invalid: [{ row, reason }] }."
      responses:
        "200": { description: OK }
        "400": { description: "invalid_file: not an .xlsx, or no Tentative start date / Ref columns" }
        "413": { description: too_large }
        "503": { description: not_ready }

  /me/notifications:
    get:
      tags: [me]
      x-phase: P6
      summary: "The notification inbox (bell icon), newest first, 50 a page: { items: [{ id, at, kind, title, body, data: PushMessage fields, read }], unread, hasMore }."
      parameters:
        - { name: before, in: query, schema: { type: string }, description: "id of the last item of the previous page" }
      responses:
        "200": { description: "OK" }
    post:
      tags: [me]
      x-phase: P6
      summary: "Mark read: { ids?: [id], all?: true } -> { unread }."
      responses:
        "200": { description: "OK" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/google or /auth/refresh (15 min). On 401, refresh once, then sign out.

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, description: "Opaque id of an assignment (one control row)" }
    PrepId:
      name: prepId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{24}$", description: "Stable id of a drill-down row (candidate phone + job + round)" }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or invalid token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found, or not visible to this user
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: What happened and how to fix it (shown to the user) }
        code: { type: string }

    DeviceInfo:
      type: object
      required: [platform, appVersion]
      properties:
        platform: { type: string, enum: [android] }
        appVersion: { type: string }
        osVersion: { type: integer, description: Android API level }
        model: { type: string }
        fcmToken: { type: string }
        notificationsEnabled: { type: boolean, description: "1.11.0, optional. NotificationManagerCompat.areNotificationsEnabled()" }
        taskChannelEnabled: { type: boolean, description: "1.11.0, optional. The task channel's importance is not NONE" }
        batteryOptimized: { type: boolean, description: "1.11.0, optional. True when the app is NOT exempt from battery optimisations" }
        backgroundRestricted: { type: boolean, description: "1.11.0, optional. ActivityManager.isBackgroundRestricted" }
        manufacturer: { type: string, maxLength: 80, description: "1.11.0, optional. Build.MANUFACTURER" }

    RosterDevice:
      type: object
      description: "1.11.0. A signed-in phone and its notification health (as last reported; null = never reported, e.g. an older app)."
      required: [lastSeenAt, healthy]
      properties:
        model: { type: [string, "null"] }
        manufacturer: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        lastSeenAt: { type: string, format: date-time }
        notificationsEnabled: { type: [boolean, "null"] }
        taskChannelEnabled: { type: [boolean, "null"] }
        batteryOptimized: { type: [boolean, "null"], description: "A warning (amber), not unhealthy" }
        backgroundRestricted: { type: [boolean, "null"] }
        healthAt: { type: [string, "null"], format: date-time, description: "When the phone last reported its health" }
        healthy:
          type: boolean
          description: "notificationsEnabled and taskChannelEnabled are true and backgroundRestricted is false (unknown counts as not healthy). Battery optimisation doesn't make a phone unhealthy."

    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [member, lead, admin] }
        teamsLinked: { type: boolean }

    RosterEntry:
      type: object
      required: [email, name, role, active]
      properties:
        email: { type: string, format: email }
        name: { type: string, description: "The value in the control sheet's Mentor dropdown (e.g. Hemanth)" }
        aliases: { type: array, items: { type: string }, description: Other spellings seen in the sheet }
        role: { type: string, enum: [member, lead, admin] }
        lead: { type: string, format: email, description: Who gets this member's escalations }
        active: { type: boolean }
        signInEmails:
          type: array
          maxItems: 5
          items: { type: string, format: email }
          description: |
            Other Google accounts this person may sign in with (e.g. a Gmail account that mirrors
            their work account). Signing in with one opens this person's session: same tasks, role
            and notifications. Each account belongs to one person and can't be a roster email.
            On PUT, omit to keep the stored list; [] removes all (their devices are signed out).
        devices:
          type: array
          readOnly: true
          items: { $ref: "#/components/schemas/RosterDevice" }
          description: "1.11.0, in answers only (ignored on PUT). The person's signed-in phones, most recently seen first; [] when none."

    TaskState:
      type: string
      enum: [new, acknowledged, screening, shortlist_ready, shared, overdue, done]
      description: |
        new → acknowledged (Start now) → screening (job running) → shortlist_ready (AI delivered)
        → shared (sent to company) → done. "overdue" applies to any open state past the deadline.
        1.11.0: `done` = "Shortlisting done" was marked (POST /tasks/{taskId}/done) and the assignee
        hasn't changed since; it wins over every other state and is never overdue. A screening the
        automation delivered still shows as `shortlist_ready` (delivered), never overdue either.

    TaskSummary:
      type: object
      required: [id, company, profilesRequired, state]
      properties:
        id: { type: string }
        company: { type: string }
        techStack: { type: string }
        profilesRequired: { type: integer }
        assignedAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        deadlineInferred: { type: boolean, description: "True when the time was ambiguous in the sheet (e.g. 3:00 read as 15:00). The app shows it for confirmation." }
        state: { $ref: "#/components/schemas/TaskState" }
        assignee: { type: [string, "null"], format: email, description: "The mentor's roster email; null when unassigned (blank Mentor cell)" }
        jobId: { type: string, format: uuid }
        ackAt: { type: string, format: date-time }
        assigneeName: { type: [string, "null"], description: "1.9.0. The mentor's roster name; null when unassigned. Always present." }
        ise: { type: string, description: '1.9.0. The PC column as written ("Sneha Padi"); "" when blank. Always present.' }
        product: { type: string, description: '1.9.0. The Product column ("Edge", "Academy", "Edge , Academy"). Always present.' }
        iseOwner:
          description: "1.9.0. The mentor the ISE maps to (first name of the PC cell, MOBILE_ISE_OWNERS); null when there's no mapping. Always present."
          oneOf:
            - type: "null"
            - type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
        doneAt: { type: [string, "null"], format: date-time, description: "1.11.0. When the shortlisting was marked done (null: not done). Always present." }
        doneBy: { type: [string, "null"], description: "1.11.0. Who marked it done (roster name; null: not done). Always present." }
        autoAssigned: { type: boolean, description: "1.11.0. The server filled the Mentor cell from the ISE mapping (assignedVia = ise). Always present." }
        assignedVia:
          type: string
          enum: [sheet, ise, app]
          description: "1.11.0. How the current mentor got the row: typed in the sheet, filled from the ISE mapping (\"via ISE\"), or taken / assigned in the app. sheet for rows nobody has. Always present."

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          properties:
            canTake: { type: boolean, description: "1.9.0. True when the Mentor cell is blank (POST /tasks/{taskId}/take)" }
            canAssign: { type: boolean, description: "1.9.0. True for admins and leads (POST /tasks/{taskId}/assign)" }
            product: { type: string }
            pc: { type: string, description: Placement coordinator (sheet column PC) }
            crm: { type: string }
            hubspotUrl: { type: string, format: uri }
            remarks: { type: string, description: Company / shortlisting remarks }
            jdUrl: { type: string, format: uri }
            internalSheetUrl: { type: string, format: uri }
            openings: { type: string }
            proposedMechanism: { type: string }
            lastConfig: { $ref: "#/components/schemas/ScreeningConfig" }
            sheetRowUrl: { type: string, format: uri, description: Link to the row in the EDGE sheet }

    ScreeningConfig:
      type: object
      required: [subsheets, focus, github, dsa, topN]
      description: Serialised to the control row's Subsheets / Screening Instructions / Github / DSA / Experience cells.
      properties:
        subsheets: { type: array, minItems: 1, items: { type: string } }
        focus: { type: string, maxLength: 4000 }
        mustHaves: { type: array, items: { type: string }, description: '"X or Y" is one item' }
        github: { type: string, enum: [off, fit, all], description: "fit = domain-fit candidates only (default)" }
        codeReview: { type: boolean, default: true }
        dsa:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            minRating:
              type: object
              properties:
                codeforces: { type: integer }
                codechef: { type: integer }
                leetcode: { type: integer }
            minSolved: { type: integer }
            minContests: { type: integer }
            minScore: { type: integer }
        experience: { type: string, description: Free text as in "Experience in Screening Domain" }
        topN: { type: integer, minimum: 1, maximum: 500 }

    Estimate:
      type: object
      required: [profiles, earlyShortlistMinutes, fullMinutes, queueAhead]
      properties:
        profiles: { type: integer, description: Rows that will be read }
        withResume: { type: integer }
        earlyShortlistMinutes: { type: integer }
        fullMinutes: { type: integer }
        queueAhead: { type: integer }
        basis: { type: string, description: "e.g. 'median of the last 10 jobs'" }

    JobStatus:
      type: string
      enum: [pending, processing, completed, failed, awaiting_review]

    Job:
      type: object
      required: [id, status, step, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string }
        company: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        step: { type: string, description: "planner / screening / evaluation / validation / delivery, or a finer checkpoint" }
        progress:
          type: object
          properties:
            total: { type: integer }
            screened: { type: integer }
            shortlisted: { type: integer }
            githubChecked: { type: integer }
        queueAhead: { type: integer }
        stopRequested: { type: boolean }
        earlyShortlistAt: { type: string, format: date-time, description: When the shortlist was first delivered (before the full screening finished) }
        deliveredTabUrl: { type: string, format: uri }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    ShortlistCandidate:
      type: object
      required: [key, rank, name, score]
      properties:
        key: { type: string, description: Mobile number key }
        rank: { type: integer }
        name: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        signals: { type: array, items: { type: string } }
        mustHaves:
          type: array
          items:
            type: object
            required: [item, met]
            properties:
              item: { type: string }
              met: { type: boolean }
              evidence: { type: string }
        githubUrl: { type: string, format: uri }
        resumeUrl: { type: string, format: uri }
        dsa: { type: string, description: Short summary, e.g. "CF 1612 · LC 420 solved" }
        standing: { type: string, description: Eligible-pool standing / Job Eligibility tag }
        conflicts: { type: array, items: { type: string }, description: "e.g. shared with another company this week" }
        decision: { type: string, enum: [share, hold, reject] }

    Analytics:
      type: object
      description: |
        Real numbers from the control sheet and the screening jobs. A row belongs to the range by its
        Assigned Date & Time (else its deadline). A delivered shortlist is the early delivery or the
        job's end, whichever came first. Rows nobody was assigned in the app are only judged on time
        when a screening delivered.
      required: [scope, totals, byMember, rows, activity]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        scope: { type: string, enum: [mine, team] }
        syncedAt: { type: string, format: date-time }
        totals:
          type: object
          properties:
            tasks: { type: integer }
            assigned: { type: integer }
            started: { type: integer, description: Rows with a screening job }
            running: { type: integer }
            delivered: { type: integer }
            failed: { type: integer }
            profilesRequired: { type: integer }
            profilesRead: { type: integer, description: Candidates the AI read }
            shortlisted: { type: integer }
            medianMinutesToShortlist: { type: integer, nullable: true }
            onTimePercent: { type: integer, nullable: true }
            overdue: { type: integer, description: "Assigned, past the deadline, no shortlist yet" }
        byMember:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              email: { type: string, format: email, nullable: true }
              tasks: { type: integer }
              started: { type: integer }
              delivered: { type: integer }
              onTime: { type: integer }
              overdue: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [taskId, company, profilesRequired, sheetRowUrl]
            properties:
              taskId: { type: string }
              company: { type: string }
              mentor: { type: string, nullable: true }
              mentorEmail: { type: string, format: email, nullable: true }
              profilesRequired: { type: integer, description: 'Upper bound when the sheet says a range ("10-15" → 15)' }
              assignedAt: { type: string, format: date-time, nullable: true }
              deadline: { type: string, format: date-time, nullable: true }
              acknowledgedAt: { type: string, format: date-time, nullable: true }
              jobStatus: { type: string, nullable: true, enum: [pending, processing, completed, failed, awaiting_review] }
              profilesRead: { type: integer, nullable: true }
              shortlisted: { type: integer, nullable: true }
              deliveredAt: { type: string, format: date-time, nullable: true }
              minutesToShortlist: { type: integer, nullable: true }
              onTime: { type: boolean, nullable: true, description: "Delivered (else, 1.11.0, marked done) by the deadline; false when past the deadline unfinished" }
              shortlistUrl: { type: string, format: uri, nullable: true }
              sheetRowUrl: { type: string, format: uri }
              doneAt: { type: string, format: date-time, nullable: true, description: "1.11.0. When it was marked done (a done row never counts as overdue)" }
        activity:
          type: array
          description: |
            1.9.0. What each member did in the range. scope=team: every active roster member, admins
            included, most active first; scope=mine: just the caller. Every count is a non-negative
            integer:
            - shortlistings: control-tab tasks assigned to the member whose shortlist was delivered
              in the range (delivered = the early shortlist or the job's end, as byMember.delivered
              counts it; by the delivery time, so a task assigned before the range can count);
              1.11.0: plus tasks marked "Shortlisting done" in the range. A task both delivered
              and marked done in the range counts once. byMember.delivered is unchanged;
            - prepsGiven: drill-down rows whose "Prep Given" says done (Yes), whose "Prep Given By"
              names the member, with the interview on an IST day the range touches;
            - prepCalls: call recordings by the member (call_at in the range) plus prep meetings they
              scheduled (not cancelled) that have started (starts_at in the range, ≤ now);
            - rsas: RSA documents the member created in the range;
            - guidanceMeets / mockInterviews: guidance / mock meetings they scheduled (not cancelled)
              that have started, starts_at in the range.
          items:
            type: object
            required: [email, name, shortlistings, prepsGiven, prepCalls, rsas, guidanceMeets, mockInterviews]
            properties:
              email: { type: string, format: email }
              name: { type: string }
              shortlistings: { type: integer, minimum: 0 }
              prepsGiven: { type: integer, minimum: 0 }
              prepCalls: { type: integer, minimum: 0 }
              rsas: { type: integer, minimum: 0 }
              guidanceMeets: { type: integer, minimum: 0 }
              mockInterviews: { type: integer, minimum: 0 }

    PrepStatus:
      type: string
      enum: [pending, done, missed, not_needed, not_informed, no_response, rescheduled, cancelled, other]
      description: 'Column M "Prep Given". pending = empty. Writes use the team spellings (Yes, Missed, Not needed, DNP …).'
    PrepTag:
      type: object
      required: [label, tone, group]
      properties:
        label: { type: string }
        tone: { type: string, enum: [pass, fail, neutral] }
        group: { type: string, description: "Academy, Edge 2.0, Edge 1.0, Marks, Sheet" }
    PrepItem:
      type: object
      required: [id, company, candidate, category, prepStatus, interviewState, mentors, mine, slaKind]
      properties:
        id: { type: string }
        row: { type: integer, description: "1-based sheet row when read (rows move; id is stable)" }
        company: { type: string }
        jobId: { type: string }
        candidate: { type: string }
        phone: { type: string, description: "10 digits, or empty" }
        round: { type: string }
        interviewDay: { type: [string, "null"], format: date }
        interviewStart: { type: [string, "null"], format: date-time, description: "Null when the sheet has no readable time" }
        interviewEnd: { type: [string, "null"], format: date-time }
        interviewTimeText: { type: string, description: "The timings cell when it couldn't be read" }
        interviewTbd: { type: boolean }
        category: { type: string, enum: [academy, edge, external] }
        edgeVersion: { type: [string, "null"], enum: ["1.0", "2.0", null] }
        stage: { type: string, description: "TR-2 cleared, Assessment cleared, Assessed · not in pool …" }
        tags: { type: array, items: { $ref: "#/components/schemas/PrepTag" } }
        mentors:
          type: array
          items: { type: object, properties: { name: { type: string }, email: { type: [string, "null"] } } }
        mine: { type: boolean }
        prepStatus: { $ref: "#/components/schemas/PrepStatus" }
        prepStatusText: { type: string }
        candidateStatus: { type: string }
        interviewState: { type: string, enum: [scheduled, completed, rescheduled, cancelled, no_show, next_round, selected, rejected, hold, other] }
        dueAt: { type: [string, "null"], format: date-time }
        slaKind: { type: string, enum: [mandatory, before_interview, none] }
        informedLate: { type: boolean, description: "ISE / PC entered it less than 24 h before the interview" }
        firstSeenAt: { type: [string, "null"], format: date-time }
        doneAt: { type: [string, "null"], format: date-time }
        mode: { type: string }
        hasResume: { type: boolean }
        hasLinks: { type: boolean }
    PrepStats:
      type: object
      properties:
        openToday: { type: integer }
        openTomorrow: { type: integer }
        overdue: { type: integer }
        unassigned: { type: integer }
        interviewsToday: { type: integer }
        doneToday: { type: integer }
        week: { type: object, properties: { done: { type: integer }, onTime: { type: integer } } }
    DocLink:
      type: object
      required: [url, kind]
      properties:
        url: { type: string }
        kind: { type: string, enum: [drilldown, transcript] }
        title: { type: string }
        updatedAt: { type: [string, "null"], format: date-time, description: "The Drive file's last change, when the server can see it" }
        own: { type: boolean, description: "From this candidate's own row" }
        seenOn:
          type: array
          items: { type: object, properties: { round: { type: string }, interviewDay: { type: [string, "null"] }, candidate: { type: string } } }
    PrepDetail:
      allOf:
        - $ref: "#/components/schemas/PrepItem"
        - type: object
          properties:
            source: { type: string, enum: [pool, assessed, sheet, none] }
            entryDay: { type: [string, "null"], format: date }
            resumeUrl: { type: string }
            process: { type: array, items: { type: string } }
            prepDay: { type: [string, "null"], format: date }
            prepTime: { type: string }
            prepDocument: { type: string }
            remarks: { type: string }
            hubspotUrl: { type: string }
            meetingUrl: { type: string }
            recordingUrl: { type: string }
            recordingNote: { type: string }
            completion: { type: string }
            links: { type: array, items: { $ref: "#/components/schemas/DocLink" } }
            journey:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  company: { type: string }
                  round: { type: string }
                  interviewDay: { type: [string, "null"] }
                  candidateStatus: { type: string }
                  interviewState: { type: string }
                  prepStatus: { $ref: "#/components/schemas/PrepStatus" }
            activity:
              type: array
              items: { type: object, properties: { at: { type: string, format: date-time }, by: { type: string }, action: { type: string }, value: { type: string } } }
            canEdit: { type: boolean }
            interviewStatusOptions: { type: array, items: { type: string } }

    PoolTrack:
      type: string
      enum: [frontend, backend, fullstack, aiml]
    Priority:
      type: string
      description: "p0 Strong > p1 Good > p2 Average > p3 Poor"
      enum: [p0, p1, p2, p3]
    PoolScore:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [exam, interview] }
        score: { type: number }
        maxScore: { type: number }
        percent: { type: integer }
        takenOn: { type: [string, "null"], format: date }
        result: { type: string }
        passed: { type: [boolean, "null"] }
        recordingUrl: { type: [string, "null"] }
        attempt: { type: string }
    PoolInterview:
      type: object
      properties:
        prepId: { type: string }
        company: { type: string }
        round: { type: string }
        day: { type: [string, "null"], format: date }
        time: { type: string }
        status: { type: string }
        state: { type: string }
        prepStatus: { type: string }
        prepBy: { type: array, items: { type: string } }
    PoolItem:
      type: object
      properties:
        uid: { type: string }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        yog: { type: [integer, "null"] }
        location: { type: [string, "null"] }
        college: { type: [string, "null"] }
        mentor: { type: object, properties: { name: { type: string }, email: { type: [string, "null"] } } }
        track: { oneOf: [{ $ref: "#/components/schemas/PoolTrack" }, { type: "null" }] }
        sheetTrack: { oneOf: [{ $ref: "#/components/schemas/PoolTrack" }, { type: "null" }] }
        sheetTechStack: { type: [string, "null"] }
        priority: { oneOf: [{ $ref: "#/components/schemas/Priority" }, { type: "null" }] }
        tags: { type: array, items: { type: string } }
        version: { type: integer }
        standing: { type: [string, "null"] }
        scorePercent: { type: [integer, "null"] }
        assessments: { type: integer }
        topScores: { type: array, items: { $ref: "#/components/schemas/PoolScore" } }
        interviews: { type: [object, "null"], properties: { count: { type: integer }, upcoming: { type: integer }, last: { oneOf: [{ $ref: "#/components/schemas/PoolInterview" }, { type: "null" }] } } }
        resumes: { type: integer }
        bestResumes: { type: integer }
        lastContact: { type: [object, "null"], properties: { at: { type: string, format: date-time }, channel: { type: string }, by: { type: string } } }
        mine: { type: boolean, description: "1.10.0. Assigned to the caller" }
        canEdit: { type: boolean, description: "1.10.0. The caller may change this candidate (their own; leads and admins: all). Edits are enforced server-side (403 not_your_candidate)." }
        groupKey: { type: string, description: "1.10.0. The PoolList.groups key this candidate is listed under: the mentor's email, name:<lower name> for a sheet mentor not on the roster, or unassigned" }
        shares:
          type: [object, "null"]
          description: "1.10.0. The company sheets the candidate is in. Null when the shares were never synced (unknown, not never shared)."
          properties:
            count: { type: integer }
            active: { type: integer, description: "Still going: outcome in_process / on_hold / unknown, and the master doesn't mark the requirement closed" }
            companies: { type: array, maxItems: 5, items: { type: string }, description: "Distinct companies, newest activity first" }
            latest: { oneOf: [{ $ref: "#/components/schemas/Share" }, { type: "null" }] }
            applied: { type: integer, description: "1.12.0. Rows in applications tabs with nothing filled in (the candidate applied; not counted in count / active)" }
        stage: { oneOf: [{ $ref: "#/components/schemas/ShareOutcome" }, { type: "null" }], description: "1.10.0. The most advanced outcome across companies (selected > in_process > on_hold > unknown > no_show > rejected); null when never shared" }
        status: { oneOf: [{ $ref: "#/components/schemas/ShareStatus" }, { type: "null" }], description: "1.12.0. The most advanced status across shared rows (else applications): selected > in_process > awaiting > on_hold > shared > applied > closed > no_show > rejected; null when in no company sheet" }
        updatedAt: { type: string, format: date-time }
