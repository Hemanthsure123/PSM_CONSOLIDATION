      type: string
      description: "1.10.0. From the Final Status first, else the latest round that says something. selected (Selected, Offer released, Hired), rejected (Rejected, Not cleared, Not shortlisted, Failed), in_process (Cleared, Shortlisted, Passed, Moved to next round, scheduled / pending / awaiting), on_hold (Hold), no_show (Absent, No show, Didn't join), unknown (anything else, or nothing yet). In a round column \"Selected\" means that round was cleared (in_process), except in the tab's last round."
